tml":"<span>Là một vùng nhớ</span>"},{"letter":"B","html":"<span>Là định danh cho tiến trình</span>"},{"letter":"C","html":"<span>Là khối quản lý thông tin</span>"},{"letter":"D","html":"<span>Là một vùng nhớ lưu trữ các thông tin quản lý tiến trình</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì PCB là vùng/khối dữ liệu lưu các thông tin quản lý tiến trình. A quá chung, B chỉ là mã định danh tiến trình, C còn thiếu ý lưu thông tin quản lý của tiến trình cụ thể.</p>"},{"id":"c2q31","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":31,"title":"Chương 2 · Câu 31","content":"<p class=\"question-text\">Hệ điều hành sẽ thực hiện hành động nào khi có một process mới sinh ra?</p>","choices":[{"letter":"A","html":"<span>Cấp CPU ngay cho process.</span>"},{"letter":"B","html":"<span>Tạo ngay khối PCB để quản lý process.</span>"},{"letter":"C","html":"<span>Giao ngay các tài nguyên mà process cần.</span>"},{"letter":"D","html":"<span>Tạo ngay khối PCB và cấp ngay các tài nguyên mà process cần.</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì khi tạo process, hệ điều hành lập PCB để quản lý nó. A không phải lúc nào cũng cấp CPU ngay, C và D không đúng vì tài nguyên/CPU còn phụ thuộc lập lịch và yêu cầu cụ thể.</p>"},{"id":"c2q32","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":32,"title":"Chương 2 · Câu 32","content":"<p class=\"question-text\">CPU đang xử lý tiến trình P1, sau đó chuyển sang xử lý tiến trình P2. Hệ điều hành sẽ lưu lại tất cả trạng thái của tiến trình P1 vào đâu?</p>","choices":[{"letter":"A","html":"<span>Đĩa cứng.</span>"},{"letter":"B","html":"<span>Bộ nhớ phụ.</span>"},{"letter":"C","html":"<span>Process Control Block (PCB).</span>"},{"letter":"D","html":"<span>Bộ nhớ ngoài.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì khi chuyển ngữ cảnh, trạng thái của tiến trình được lưu trong PCB. A, B, D là các nơi lưu trữ chung nhưng không phải cấu trúc chuẩn dùng để lưu trạng thái tiến trình khi context switch.</p>"},{"id":"c2q33","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":33,"title":"Chương 2 · Câu 33","content":"<p class=\"question-text\">Process Control Block (PCB) được tạo ra vào thời điểm nào? cùng với tiến trình và không thay đổi trong suốt thời gian tiến trình tồn tại.</p>","choices":[{"letter":"A","html":"<span>Thời điểm tiến trình vào trạng thái sẵn sàng (Ready)</span>"},{"letter":"B","html":"<span>Thời điểm khởi tạo tiến trình (New).</span>"},{"letter":"C","html":"<span>Thời điểm kết thúc tiến trình (Terminated).</span>"},{"letter":"D","html":"<span>Thời điểm tiến trình vào trạng thái đang chạy (Running).</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì PCB được tạo khi tiến trình được khởi tạo. A và D xảy ra sau khi tiến trình đã có PCB, C là lúc thu hồi/hủy PCB.</p>"},{"id":"c2q34","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":34,"title":"Chương 2 · Câu 34","content":"<p class=\"question-text\">Trong Process Control Block (PCB), các thông tin ngữ cảnh của tiến trình gồm có:</p>","choices":[{"letter":"A","html":"<span>Các giá trị thanh ghi.</span>"},{"letter":"B","html":"<span>Trạng thái tiến trình.</span>"},{"letter":"C","html":"<span>Thông tin quản lý bộ nhớ.</span>"},{"letter":"D","html":"<span>Trạng thái tiến trình, giá trị các thanh ghi, thông tin bộ nhớ.</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì PCB lưu nhiều thông tin ngữ cảnh như trạng thái tiến trình, thanh ghi và thông tin bộ nhớ. A, B, C chỉ nêu từng phần riêng lẻ nên chưa đầy đủ.</p>"},{"id":"c2q35","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":35,"title":"Chương 2 · Câu 35","content":"<p class=\"question-text\">Khi Hệ điều hành cho CPU quay lại xử lý tiến trình, CPU cần nạp lại các thông tin trạng thái của tiến trình đó để nó tiếp tục xử lý. Những thông tin đó được nạp lại từ đâu?</p>","choices":[{"letter":"A","html":"<span>disk.</span>"},{"letter":"B","html":"<span>memory.</span>"},{"letter":"C","html":"<span>PCB</span>"},{"letter":"D","html":"<span>Kernel.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì trạng thái tiến trình được lưu trong PCB và được nạp lại khi tiếp tục thực thi. A, B là nơi lưu trữ chung, D là nhân hệ điều hành chứ không phải nơi chứa trực tiếp bộ trạng thái của tiến trình.</p>"},{"id":"c2q36","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":36,"title":"Chương 2 · Câu 36","content":"<p class=\"question-text\">Khi tiến trình kết thúc, hệ thống sẽ:</p>","choices":[{"letter":"A","html":"<span>Thu hồi lại PCB của tiến trình.</span>"},{"letter":"B","html":"<span>Thu hồi lại tài nguyên của tiến trình.</span>"},{"letter":"C","html":"<span>Thu hồi lại PCB và tài nguyên của tiến trình.</span>"},{"letter":"D","html":"<span>Loại nó ra khỏi hàng đợi Ready Queue.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì khi tiến trình kết thúc, hệ thống phải thu hồi cả PCB và các tài nguyên đã cấp. A và B chỉ nêu một phần, D chỉ đúng trong một tình huống hẹp và không đầy đủ.</p>"},{"id":"c2q37","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":37,"title":"Chương 2 · Câu 37","content":"<p class=\"question-text\">Đặc điểm của phương pháp liên lạc giữa các tiến trình qua vùng nhớ chia sẻ (shared memory) là gì?</p>","choices":[{"letter":"A","html":"<span>Nhanh nhất để trao đổi dữ liệu.</span>"},{"letter":"B","html":"<span>Hiệu quả nhất cho các hệ phân tán.</span>"},{"letter":"C","html":"<span>An toàn nhất để bảo vệ dữ liệu.</span>"},{"letter":"D","html":"<span>Bảo vệ phần cứng máy tính.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì shared memory cho các tiến trình trao đổi dữ liệu trực tiếp qua vùng nhớ chung nên rất nhanh. B thường phù hợp hơn với truyền thông điệp qua mạng, C không hẳn an toàn nhất vì cần đồng bộ, D không liên quan.</p>"},{"id":"c2q38","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":38,"title":"Chương 2 · Câu 38","content":"<p class=\"question-text\">Điều kiện để liên lạc bằng thông điệp kiểu gián tiếp giữa các tiến trình:</p>","choices":[{"letter":"A","html":"<span>Mỗi tiến trình phải có một cổng riêng.</span>"},{"letter":"B","html":"<span>Các tiến trình có chung vùng nhớ.</span>"},{"letter":"C","html":"<span>Các tiến trình có một cổng dùng chung.</span>"},{"letter":"D","html":"<span>Các tiến trình lưu trữ chung.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì liên lạc thông điệp gián tiếp thường thông qua mailbox/cổng dùng chung. A không tạo điểm trao đổi chung, B là shared memory chứ không phải message passing, D không phải điều kiện liên lạc.</p>"},{"id":"c2q39","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":39,"title":"Chương 2 · Câu 39","content":"<p class=\"question-text\">Một tiến trình (process) có nhiều luồng (threads). Thành phần nào dưới đây là DÙNG CHUNG giữa tiến trình (Process) và các luồng (Threads) của nó?</p>","choices":[{"letter":"A","html":"<span>không gian bộ nhớ.</span>"},{"letter":"B","html":"<span>con trỏ lệnh.</span>"},{"letter":"C","html":"<span>các thanh ghi và ngăn xếp.</span>"},{"letter":"D","html":"<span>Thanh ghi và con trỏ lệnh.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì các luồng trong cùng một tiến trình dùng chung không gian bộ nhớ. B, C, D sai vì mỗi luồng thường có con trỏ lệnh, thanh ghi và ngăn xếp riêng.</p>"},{"id":"c2q40","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":40,"title":"Chương 2 · Câu 40","content":"<p class=\"question-text\">Phát biểu nào sau đây là ĐÚNG về quan hệ giữa User thread và Kernel thread?</p>","choices":[{"letter":"A","html":"<span>Phải có quan hệ ánh xạ.</span>"},{"letter":"B","html":"<span>Hai luồng hoàn toàn độc lập nhau.</span>"},{"letter":"C","html":"<span>Không cần có quan hệ ánh xạ.</span>"},{"letter":"D","html":"<span>Luồng nhân được ưu tiên xử lý trước.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì user thread cần được ánh xạ/liên hệ với kernel thread để được hệ điều hành lập lịch thực thi. B và C phủ nhận quan hệ này, D không phải phát biểu đúng về bản chất ánh xạ.</p>"},{"id":"c2q41","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":41,"title":"Chương 2 · Câu 41","content":"<p class=\"question-text\">Trong cùng một tiến trình, các luồng (thread) có thể chia sẻ cho nhau thành phần nào?</p>","choices":[{"letter":"A","html":"<span>code section</span>"},{"letter":"B","html":"<span>data section</span>"},{"letter":"C","html":"<span>các resources khác của OS</span>"},{"letter":"D","html":"<span>code section, data section, các resources khác của OS</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì các luồng trong cùng tiến trình có thể chia sẻ mã lệnh, vùng dữ liệu và các tài nguyên của tiến trình. A, B, C chỉ nêu một phần nên chưa đầy đủ.</p>"},{"id":"c2q42","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":42,"title":"Chương 2 · Câu 42","content":"<p class=\"question-text\">Để được CPU thực thi, các luồng người dùng (user thread) cần phải:</p>","choices":[{"letter":"A","html":"<span>được ánh xạ vào một luồng nhân (kernel thread) tương ứng.</span>"},{"letter":"B","html":"<span>được đưa vào hàng đợi CPU.</span>"},{"letter":"C","html":"<span>được đưa vào hàng đợi công việc (Job queue).</span>"},{"letter":"D","html":"<span>được gán một chỉ số thực thi luồng (thread).</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì user thread cần được ánh xạ tới kernel thread/LWP để hệ điều hành có thể lập lịch trên CPU. B, C là hàng đợi chung không mô tả quan hệ user-kernel thread, D không phải điều kiện để CPU thực thi.</p>"},{"id":"c3q1","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":1,"title":"Chương 3 · Câu 1","content":"<h2>Thuật ngữ “thông lượng” của một CPU là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">là số lượng tiến trình mà CPU hoàn thành trên một đơn vị thời gian</span>"},{"letter":"B","html":"<span class=\"option-text\">là số dữ liệu truy xuất từ CPU đến RAM trong một đơn vị thời gian</span>"},{"letter":"C","html":"<span class=\"option-text\">là số phép toán CPU thực hiện trong một đơn vị thời gian</span>"},{"letter":"D","html":"<span class=\"option-text\">là số tài nguyên mà CPU sử dụng trong một đơn vị thời gian</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Thông lượng (throughput) là số tiến trình hoàn thành trong một đơn vị thời gian. B nói về truyền dữ liệu CPU-RAM, C nói về tốc độ phép toán, D nói về mức dùng tài nguyên nên không đúng định nghĩa throughput.</p>"},{"id":"c3q2","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":2,"title":"Chương 3 · Câu 2","content":"<h2>Đâu không phải là vai trò của hệ điều hành trong quản lý tiến trình?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tạo và hủy các tiến trình của người sử dụng và của hệ thống</span>"},{"letter":"B","html":"<span class=\"option-text\">Điều khiển bộ nhớ vật lý cho việc nạp tiến trình.</span>"},{"letter":"C","html":"<span class=\"option-text\">Cung cấp các cơ chế đồng bộ tiến trình.</span>"},{"letter":"D","html":"<span class=\"option-text\">Cung cấp các cơ chế giao tiếp giữa các tiến trình.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Quản lý bộ nhớ vật lý thuộc mảng quản lý bộ nhớ, không phải vai trò trực tiếp của quản lý tiến trình. A, C, D đều là các nhiệm vụ quen thuộc trong quản lý tiến trình.</p>"},{"id":"c3q3","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":3,"title":"Chương 3 · Câu 3","content":"<h2>Đâu không phải là lý do để Hệ điều hành thực hiện điều phối tiến trình (hay định thời / lập lịch cho CPU)?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Thực thi nhiều chương trình đồng thời để tăng hiệu suất hệ thống.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tại mỗi thời điểm, một CPU chỉ thực thi được một process.</span>"},{"letter":"C","html":"<span class=\"option-text\">Trong các process chạy đồng thời, có những process cần ưu tiên hơn.</span>"},{"letter":"D","html":"<span class=\"option-text\">Bộ nhớ RAM không đủ để chạy nhiều tiến trình cùng lúc.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Điều phối CPU nhằm chọn tiến trình được chạy trên CPU, xử lý cạnh tranh CPU và ưu tiên. Thiếu RAM là vấn đề quản lý bộ nhớ/swapping, không phải lý do chính của CPU scheduling.</p>"},{"id":"c3q4","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":4,"title":"Chương 3 · Câu 4","content":"<h2>Để thực hiện điều phối tiến trình (hay định thời / lập lịch cho CPU), các tiến trình thực thi cần phải:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">đưa các tiến trình vào hàng đợi Ready.</span>"},{"letter":"B","html":"<span class=\"option-text\">đưa các tiến trình vào hàng đợi I/O</span>"},{"letter":"C","html":"<span class=\"option-text\">đưa các tiến trình vào bộ nhớ phụ.</span>"},{"letter":"D","html":"<span class=\"option-text\">đưa các tiến trình vào CPU.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>CPU scheduler chọn tiến trình từ Ready queue. I/O queue dành cho tiến trình đang chờ nhập/xuất, bộ nhớ phụ liên quan swapping, còn CPU là nơi thực thi sau khi đã được chọn.</p>"},{"id":"c3q5","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":5,"title":"Chương 3 · Câu 5","content":"<h2>Điều phối tiến trình (hay định thời / lập lịch cho CPU) của Hệ điều hành là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">là việc chọn thời điểm cho CPU thực thi một process nào đó từ I/O queue</span>"},{"letter":"B","html":"<span class=\"option-text\">là việc chọn thời điểm cho CPU thực thi một process nào đó từ Ready queue.</span>"},{"letter":"C","html":"<span class=\"option-text\">là việc chọn thời điểm cho Hệ điều hành thực thi một process.</span>"},{"letter":"D","html":"<span class=\"option-text\">là việc chọn thời điểm cho Hệ điều hành nạp Process vào bộ nhớ.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Lập lịch CPU chọn tiến trình đang sẵn sàng trong Ready queue để cấp CPU. A sai vì I/O queue là chờ I/O; C diễn đạt sai chủ thể; D là nạp vào bộ nhớ, không phải cấp CPU.</p>"},{"id":"c3q6","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":6,"title":"Chương 3 · Câu 6","content":"<h2>Bộ định thời nào dùng cho việc quyết định chọn lựa tiến trình đưa vào CPU thực thi?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Bộ định thời CPU (CPU scheduler).</span>"},{"letter":"B","html":"<span class=\"option-text\">Bộ định thời công việc (Job scheduler).</span>"},{"letter":"C","html":"<span class=\"option-text\">Bộ định thời trung hạn (Medium-term scheduler).</span>"},{"letter":"D","html":"<span class=\"option-text\">Bộ định thời thiết bị (Device scheduler).</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>CPU scheduler chọn tiến trình từ Ready queue để chạy. Job scheduler chọn công việc đưa vào hệ thống, medium-term scheduler liên quan swapping, device scheduler liên quan thiết bị I/O.</p>"},{"id":"c3q7","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":7,"title":"Chương 3 · Câu 7","content":"<h2>Bộ định thời nào dùng cho việc quyết định thời hạn (during) thực thi tiến trình của CPU?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Bộ định thời CPU (CPU scheduler).</span>"},{"letter":"B","html":"<span class=\"option-text\">Bộ định thời công việc (Job scheduler).</span>"},{"letter":"C","html":"<span class=\"option-text\">Bộ định thời trung hạn (Medium-term scheduler).</span>"},{"letter":"D","html":"<span class=\"option-text\">Bộ định thời thiết bị (Device scheduler).</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Các quyết định cấp CPU và thời điểm/độ dài lần cấp CPU thuộc CPU scheduler. Các bộ định thời còn lại xử lý công việc, swapping hoặc thiết bị I/O.</p>"},{"id":"c3q8","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":8,"title":"Chương 3 · Câu 8","content":"<h2>Bộ định thời nào quyết định thời điểm chuyển một tiến trình từ bộ nhớ sang bộ nhớ phụ (kỹ thuật Swapping).</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Bộ định thời CPU (CPU scheduler).</span>"},{"letter":"B","html":"<span class=\"option-text\">Bộ định thời công việc (Job scheduler).</span>"},{"letter":"C","html":"<span class=\"option-text\">Bộ định thời trung hạn (Medium-term scheduler).</span>"},{"letter":"D","html":"<span class=\"option-text\">Bộ định thời thiết bị (Device scheduler).</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Medium-term scheduler quản lý việc tạm đưa tiến trình ra/vào bộ nhớ chính bằng swapping. CPU scheduler chỉ chọn tiến trình chạy; job scheduler chọn job vào hệ thống; device scheduler xử lý I/O.</p>"},{"id":"c3q9","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":9,"title":"Chương 3 · Câu 9","content":"<h2>Hệ điều hành điều phối tiến trình theo hướng vì lợi ích cho người dùng (User-oriented), tiêu chí nào KHÔNG thuộc hướng này?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Thời gian đáp ứng (Response time) sao cho nhanh nhất.</span>"},{"letter":"B","html":"<span class=\"option-text\">Thời gian quay vòng (Turnaround time) sao cho nhanh nhất.</span>"},{"letter":"C","html":"<span class=\"option-text\">Thời gian chờ (Waiting time) sao cho ít nhất.</span>"},{"letter":"D","html":"<span class=\"option-text\">Thông lượng (throughput) tiến trình sao cho ít nhất.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Response time, turnaround time và waiting time ảnh hưởng trực tiếp cảm nhận người dùng. Throughput là tiêu chí hệ thống và phải càng nhiều càng tốt, không phải càng ít.</p>"},{"id":"c3q10","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":10,"title":"Chương 3 · Câu 10","content":"<h2>Hệ điều hành điều phối tiến trình theo hướng vì lợi ích của hệ thống (System-oriented), tiêu chí nào KHÔNG thuộc hướng này?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Sử dụng CPU (processor utilization): sao cho hiệu quả nhất.</span>"},{"letter":"B","html":"<span class=\"option-text\">Công bằng (fairness) nhất đối với các tiến trình.</span>"},{"letter":"C","html":"<span class=\"option-text\">Thời gian chờ (Waiting time) sao cho dài nhất.</span>"},{"letter":"D","html":"<span class=\"option-text\">Thông lượng (throughput) tiến trình sao cho nhiều nhất.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Hệ thống cần dùng CPU hiệu quả, công bằng và throughput cao. Waiting time dài là điều xấu, không phải mục tiêu tối ưu.</p>"},{"id":"c3q11","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":11,"title":"Chương 3 · Câu 11","content":"<h2>Với mỗi giải thuật điều phối tiến trình, cần phải trình bày 2 yếu tố nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Selection function và Decision mode</span>"},{"letter":"B","html":"<span class=\"option-text\">Response time và Turnaround time</span>"},{"letter":"C","html":"<span class=\"option-text\">Selection function và Response time</span>"},{"letter":"D","html":"<span class=\"option-text\">Waiting time và Throughput</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Một giải thuật lập lịch cần nêu hàm lựa chọn tiến trình (selection function) và chế độ quyết định có/không trưng dụng (decision mode). Các phương án B, C, D chỉ là tiêu chí đánh giá hoặc trộn lẫn tiêu chí.</p>"},{"id":"c3q12","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":12,"title":"Chương 3 · Câu 12","content":"<h2>Những chỉ số nào dưới đây KHÔNG dùng để đánh giá hiệu quả của một giải thuật điều phối tiến trình?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">thời gian đợi của tiến trình trong hệ thống.</span>"},{"letter":"B","html":"<span class=\"option-text\">thời gian tiến trình được CPU phục vụ.</span>"},{"letter":"C","html":"<span class=\"option-text\">thời gian hoàn thành thực thi tiến trình.</span>"},{"letter":"D","html":"<span class=\"option-text\">thời gian tiến trình được nạp vào bộ nhớ.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Các tiêu chí đánh giá lập lịch xoay quanh chờ, đáp ứng, hoàn thành/quay vòng, sử dụng CPU, throughput. Thời gian nạp vào bộ nhớ thuộc quản lý bộ nhớ nên không phải tiêu chí đánh giá CPU scheduling.</p>"},{"id":"c3q13","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":13,"title":"Chương 3 · Câu 13","content":"<h2>Chế độ “Preemptive” trong điều phối tiến trình là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình không trả CPU cho đến khi nó hoàn thành.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình trả CPU ngay khi giải thuật điều phối của Hệ điều hành yêu cầu.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình chiếm dụng bộ nhớ trong quá trình thi hành.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình giải phóng bộ nhớ khi giải thuật điều phối của Hệ điều hành yêu cầu.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Preemptive cho phép hệ điều hành thu hồi CPU từ tiến trình đang chạy khi cần. A là non-preemptive; C và D nói về bộ nhớ, không phải cơ chế thu hồi CPU.</p>"},{"id":"c3q14","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":14,"title":"Chương 3 · Câu 14","content":"<h2>Chế độ “Non-Preemptive” trong điều phối tiến trình là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình không trả CPU cho đến khi nó hoàn thành.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình trả CPU ngay khi giải thuật điều phối của Hệ điều hành yêu cầu.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình chiếm dụng bộ nhớ trong quá trình thi hành.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình giải phóng bộ nhớ khi giải thuật điều phối của Hệ điều hành yêu cầu.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Non-preemptive nghĩa là hệ điều hành không cưỡng bức thu hồi CPU; tiến trình giữ CPU cho đến khi xong hoặc tự nhường/chặn. B là preemptive; C, D không nói về định thời CPU.</p>"},{"id":"c3q15","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":15,"title":"Chương 3 · Câu 15","content":"<h2>Nguyên tắc chọn tiến trình từ hàng đợi Ready vào cho CPU thực thi của giải thuật điều phối FCFS (First-Come, First-Served) là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình Pi vào Ready queue trước sẽ được cấp CPU trước.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít nhất sẽ được cấp CPU trước.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít hơn thời gian còn lại của “process đang chạy” sẽ được cấp CPU.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình Pi trong Ready queue có độ ưu tiên tốt nhất sẽ được cấp CPU trước</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>FCFS phục vụ theo thứ tự đến trước. B là SJF, C là SRTF, D là Priority scheduling.</p>"},{"id":"c3q16","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":16,"title":"Chương 3 · Câu 16","content":"<h2>Nguyên tắc chọn tiến trình từ hàng đợi Ready vào cho CPU thực thi của giải thuật điều phối SJF (Shortest Job First) là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình Pi vào Ready queue trước sẽ được cấp CPU trước.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít nhất sẽ được cấp CPU trước.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít hơn thời gian còn lại của “process đang chạy” sẽ được cấp CPU.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình Pi trong Ready queue có độ ưu tiên tốt nhất sẽ được cấp CPU trước.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SJF chọn tiến trình có CPU burst ngắn nhất. A là FCFS, C là SRTF dạng trưng dụng, D là Priority.</p>"},{"id":"c3q17","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":17,"title":"Chương 3 · Câu 17","content":"<h2>Nguyên tắc chọn tiến trình từ hàng đợi Ready vào cho CPU thực thi của giải thuật điều phối SRTF (Shortest Remaining Time First) là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình Pi vào Ready queue trước sẽ được cấp CPU trước.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít nhất sẽ được cấp CPU trước.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít hơn thời gian còn lại của “process đang chạy” sẽ được cấp CPU.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình Pi trong Ready queue có độ ưu tiên tốt nhất sẽ được cấp CPU trước.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SRTF là SJF có trưng dụng: nếu tiến trình mới có thời gian còn lại ngắn hơn tiến trình đang chạy, CPU có thể bị thu hồi. A là FCFS, B là SJF không trưng dụng, D là Priority.</p>"},{"id":"c3q18","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":18,"title":"Chương 3 · Câu 18","content":"<h2>Nguyên tắc chọn tiến trình từ hàng đợi Ready vào cho CPU thực thi của giải thuật điều phối Priority là gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình Pi vào Ready queue trước sẽ được cấp CPU trước.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít nhất sẽ được cấp CPU trước.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình Pi có thời gian chiếm dụng CPU ít hơn thời gian còn lại của “process đang chạy” sẽ được cấp CPU.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình Pi trong Ready queue có độ ưu tiên tốt nhất sẽ được cấp CPU trước.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Priority scheduling chọn tiến trình có độ ưu tiên tốt nhất. A là FCFS, B là SJF, C là SRTF.</p>"},{"id":"c3q19","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":19,"title":"Chương 3 · Câu 19","content":"<h2>Đối với giải thuật điều phối tiến trình FCFS và SJF, “thời gian chờ” và “thời gian đáp ứng” của một tiến trình là như thế nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">“thời gian chờ” lớn hơn “thời gian đáp ứng”.</span>"},{"letter":"B","html":"<span class=\"option-text\">“thời gian chờ” nhỏ hơn “thời gian đáp ứng”.</span>"},{"letter":"C","html":"<span class=\"option-text\">“thời gian chờ” bằng “thời gian đáp ứng”.</span>"},{"letter":"D","html":"<span class=\"option-text\">“thời gian chờ” và “thời gian đáp ứng” có sự khác biệt giữa FCFS và SJF.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Với FCFS và SJF không trưng dụng, tiến trình khi bắt đầu được CPU phục vụ thường chạy một mạch, nên thời gian đáp ứng bằng thời gian chờ đến lần chạy đầu tiên. A, B, D không đúng cho trường hợp này.</p>"},{"id":"c3q20","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":20,"title":"Chương 3 · Câu 20","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,3. Cho biết “thời gian chờ” của tiến trình P2 theo giải thuật điều phối tiến trình FCFS:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">30</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>FCFS chạy theo thứ tự P1 -&gt; P2 -&gt; P3. P2 phải chờ P1 chạy xong 24 đơn vị, nên waiting time của P2 là 24. Các số 0, 27, 30 không phải thời gian chờ của P2.</p>"},{"id":"c3q21","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":21,"title":"Chương 3 · Câu 21","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,3. Cho biết “thời gian chờ” của tiến trình P3 theo giải thuật điều phối tiến trình FCFS:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">30</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>P3 phải chờ P1 và P2 chạy xong: 24 + 3 = 27. Vì vậy C đúng; 0 là của P1, 24 là của P2, 30 là tổng burst time.</p>"},{"id":"c3q22","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":22,"title":"Chương 3 · Câu 22","content":"<h2>Cho ba tiến trình P1, P2, P3 với các Burst time tương ứng là: 24,3,3. Xác định “thời gian chờ trung bình” theo giải thuật điều phối tiến trình FCFS:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">3</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">17</span>"},{"letter":"D","html":"<span class=\"option-text\">30</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Waiting time lần lượt là P1=0, P2=24, P3=27. Trung bình = (0+24+27)/3 = 17. Các lựa chọn khác không phải giá trị trung bình.</p>"},{"id":"c3q23","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":23,"title":"Chương 3 · Câu 23","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,3. Cho biết “thời gian đáp ứng” của tiến trình P3 theo giải thuật điều phối tiến trình FCFS:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">30</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Với FCFS không trưng dụng, response time của P3 bằng thời gian chờ đến lần đầu được CPU: 24 + 3 = 27. Các phương án khác không đúng cho P3.</p>"},{"id":"c3q24","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":24,"title":"Chương 3 · Câu 24","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,4. Cho biết “thời gian chờ” của tiến trình P1 theo giải thuật điều phối tiến trình SJF:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">7</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SJF xếp P2(3) -&gt; P3(4) -&gt; P1(24). P1 chờ P2 và P3: 3 + 4 = 7. Vì vậy D đúng.</p>"},{"id":"c3q25","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":25,"title":"Chương 3 · Câu 25","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,4. Cho biết “thời gian chờ” của tiến trình P2 theo giải thuật điều phối tiến trình SJF:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">7</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>P2 có burst ngắn nhất nên được chạy đầu tiên, chờ 0. Các số 24, 27, 7 không phải waiting time của P2.</p>"},{"id":"c3q26","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":26,"title":"Chương 3 · Câu 26","content":"<h2>Cho ba tiến trình P1, P2, P3 với Burst time tương ứng là: 24,3,4. Cho biết “thời gian chờ” của tiến trình P3 theo giải thuật điều phối tiến trình SJF:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">3</span>"},{"letter":"B","html":"<span class=\"option-text\">24</span>"},{"letter":"C","html":"<span class=\"option-text\">27</span>"},{"letter":"D","html":"<span class=\"option-text\">6</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Thứ tự SJF là P2 -&gt; P3 -&gt; P1, nên P3 chỉ chờ P2 chạy 3 đơn vị. B, C, D không đúng.</p>"},{"id":"c3q27","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":27,"title":"Chương 3 · Câu 27","content":"<h2>Cho ba tiến trình P1, P2, P3 với các Burst time tương ứng là: 24,3,3. Xác định “thời gian chờ trung bình” theo giải thuật điều phối tiến trình SJF:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">6</span>"},{"letter":"B","html":"<span class=\"option-text\">10</span>"},{"letter":"C","html":"<span class=\"option-text\">17</span>"},{"letter":"D","html":"<span class=\"option-text\">3</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Hai tiến trình ngắn P2 và P3 chạy trước, rồi P1. Waiting time có thể là 0, 3, 6; trung bình = 9/3 = 3. Vì vậy D đúng.</p>"},{"id":"c3q28","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":28,"title":"Chương 3 · Câu 28","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết trình tự CPU thực thi tiến trình theo giải thuật điều phối SJF (Shortest Job First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">P3 &gt; P2 &gt; P4 &gt; P1</span>"},{"letter":"B","html":"<span class=\"option-text\">P1 &gt; P3 &gt; P2 &gt; P4</span>"},{"letter":"C","html":"<span class=\"option-text\">P3 &gt; P2 &gt; P1 &gt; P4</span>"},{"letter":"D","html":"<span class=\"option-text\">P1 &gt; P2 &gt; P3 &gt; P4</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SJF không trưng dụng: tại t=0 chỉ có P1 nên P1 chạy trước đến t=7; sau đó chọn burst ngắn nhất là P3, rồi P2 và P4. Vì vậy thứ tự là P1 -&gt; P3 -&gt; P2 -&gt; P4.</p>"},{"id":"c3q29","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":29,"title":"Chương 3 · Câu 29","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết trình tự CPU thực thi tiến trình theo giải thuật điều phối SRTF (Shortest Remaining Time First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">P3 &gt; P2 &gt; P4 &gt; P1</span>"},{"letter":"B","html":"<span class=\"option-text\">P1 &gt; P3 &gt; P2 &gt; P4 &gt; P4 &gt; P1</span>"},{"letter":"C","html":"<span class=\"option-text\">P3 &gt; P2 &gt; P1 &gt; P4</span>"},{"letter":"D","html":"<span class=\"option-text\">P1 &gt; P2 &gt; P3 &gt; P2 &gt; P4 &gt; P1</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SRTF có trưng dụng: P1 chạy 0-2, P2 chạy 2-4, P3 chạy 4-5, P2 chạy tiếp 5-7, P4 chạy 7-11, P1 chạy 11-16. Chuỗi là P1 -&gt; P2 -&gt; P3 -&gt; P2 -&gt; P4 -&gt; P1.</p>"},{"id":"c3q30","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":30,"title":"Chương 3 · Câu 30","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết “thời gian chờ” của tiến trình P3 theo giải thuật điều phối SJF (Shortest Job First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">7</span>"},{"letter":"C","html":"<span class=\"option-text\">11</span>"},{"letter":"D","html":"<span class=\"option-text\">12</span>"}],"correct":null,"note":"<div class=\"special-note no-choice\"><b>Câu này không có lựa chọn đúng trong A-D.</b><br/>Kết quả đúng theo công thức chuẩn: <b>3</b>.</div>","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Theo công thức chuẩn waiting time = thời điểm bắt đầu chạy - arrival time. Với SJF: P1 chạy 0-7, P3 bắt đầu ở t=7 và arrival của P3 là 4, nên waiting time = 7 - 4 = 3. File gốc không có lựa chọn 3; nếu đề bắt buộc chọn B=7 thì đó là thời điểm bắt đầu chạy, không phải thời gian chờ chuẩn.</p>"},{"id":"c3q31","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":31,"title":"Chương 3 · Câu 31","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết “thời gian đáp ứng” của tiến trình P2 theo giải thuật điều phối SRTF (Shortest Remaining Time First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">7</span>"},{"letter":"C","html":"<span class=\"option-text\">11</span>"},{"letter":"D","html":"<span class=\"option-text\">9</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>P2 đến ở t=2 và được CPU ngay tại t=2, nên response time = 2 - 2 = 0. Các giá trị 7, 11, 9 là các mốc khác, không phải response time.</p>"},{"id":"c3q32","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":32,"title":"Chương 3 · Câu 32","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết “thời gian chờ” của tiến trình P2 theo giải thuật điều phối SRTF (Shortest Remaining Time First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">7</span>"},{"letter":"C","html":"<span class=\"option-text\">11</span>"},{"letter":"D","html":"<span class=\"option-text\">1</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>P2 hoàn thành ở t=7, arrival=2, burst=4. Waiting time = completion - arrival - burst = 7 - 2 - 4 = 1. Vì vậy D đúng.</p>"},{"id":"c3q33","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":33,"title":"Chương 3 · Câu 33","content":"<h2>Bảng dưới thể hiện danh sách các tiến trình trong hàng đợi. Hãy cho biết “thời gian chờ” của tiến trình P3 theo giải thuật điều phối SRTF (Shortest Remaining Time First):</h2>\n<div class=\"process-table-wrap\"><table aria-label=\"Bảng tiến trình\" class=\"process-table\"><thead><tr><th>Process</th><th>Arrival Time</th><th>Burst Time</th></tr></thead><tbody><tr><td>P1</td><td>0</td><td>7</td></tr><tr><td>P2</td><td>2</td><td>4</td></tr><tr><td>P3</td><td>4</td><td>1</td></tr><tr><td>P4</td><td>5</td><td>4</td></tr></tbody></table></div>","choices":[{"letter":"A","html":"<span class=\"option-text\">0</span>"},{"letter":"B","html":"<span class=\"option-text\">7</span>"},{"letter":"C","html":"<span class=\"option-text\">11</span>"},{"letter":"D","html":"<span class=\"option-text\">12</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>P3 đến ở t=4 và được chạy ngay từ t=4 đến t=5, nên không phải chờ: waiting time = 0. Các mốc 7, 11, 12 không đúng.</p>"},{"id":"c3q34","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":34,"title":"Chương 3 · Câu 34","content":"<h2>Giải thuật điều phối tiến trình nào sau đây có sử dụng kỹ thuật Swapping?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Đến trước phục vụ trước (FIFO).</span>"},{"letter":"B","html":"<span class=\"option-text\">Round-robin và độ ưu tiên.</span>"},{"letter":"C","html":"<span class=\"option-text\">Công việc ngắn định thời trước (SJF).</span>"},{"letter":"D","html":"<span class=\"option-text\">Không dùng giải thuật.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Swapping thuộc chức năng của bộ định thời trung hạn/quản lý bộ nhớ, không phải bản chất của các giải thuật CPU như FCFS, Round Robin, Priority hay SJF.</p>"},{"id":"c3q35","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":35,"title":"Chương 3 · Câu 35","content":"<h2>Trong giải thuật điều phối tiến trình “Round Robin”, CPU thực thi các tiến trình trong hàng đợi Ready theo thứ tự nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Từ đầu Queue đến cuối Queue.</span>"},{"letter":"B","html":"<span class=\"option-text\">Từ cuối Queue lên đầu Queue.</span>"},{"letter":"C","html":"<span class=\"option-text\">Xoay vòng lần lượt sau một thời gian xác định (quantum time)</span>"},{"letter":"D","html":"<span class=\"option-text\">Xoay vòng khi thực thi hoàn thành cho một tiến trình.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Round Robin cấp CPU theo vòng, mỗi tiến trình được một time quantum. A chưa nói đến quantum, B sai chiều, D sai vì RR không cần đợi tiến trình hoàn thành.</p>"},{"id":"c3q36","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":36,"title":"Chương 3 · Câu 36","content":"<h2>Trong giải thuật điều phối tiến trình “Round Robin”, khi CPU thực thi tiến trình hết quantum time thì:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tiến trình sẽ được cấp tiếp một quantum time mới.</span>"},{"letter":"B","html":"<span class=\"option-text\">Tiến trình sẽ đưa về cuối Hàng đợi Ready.</span>"},{"letter":"C","html":"<span class=\"option-text\">Tiến trình sẽ đưa về đầu hàng đợi công việc (Job queue).</span>"},{"letter":"D","html":"<span class=\"option-text\">Tiến trình sẽ đưa vào bộ nhớ phụ.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Khi hết quantum mà chưa xong, tiến trình bị đưa về cuối Ready queue để chờ lượt sau. A sai vì không được cấp ngay liên tục; C và D không thuộc cơ chế Round Robin.</p>"},{"id":"c3q37","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":37,"title":"Chương 3 · Câu 37","content":"<h2>Trong giải thuật điều phối tiến trình “Round Robin”, ngoài sự kiện hết quantum time, hệ điều hành thu hồi CPU của tiến trình khi nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Khi tiến trình có độ ưu tiên thấp hơn tiến trình kế tiếp.</span>"},{"letter":"B","html":"<span class=\"option-text\">Khi tiến trình có thời gian thực thi dài hơn quantum time.</span>"},{"letter":"C","html":"<span class=\"option-text\">Khi tiến trình vào trạng thái Blocked hoặc tiến trình kết thúc.</span>"},{"letter":"D","html":"<span class=\"option-text\">Khi tiến trình có độ ưu tiên lớn.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Nếu tiến trình chờ I/O/sự kiện (Blocked) hoặc đã kết thúc thì nó không thể tiếp tục giữ CPU. A và D thuộc Priority, B chỉ mô tả điều kiện liên quan quantum chứ không phải sự kiện ngoài quantum.</p>"},{"id":"c3q38","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":38,"title":"Chương 3 · Câu 38","content":"<h2>Trong giải thuật điều phối tiến trình “Preemptive Priority” (độ ưu tiên – cho phép trưng dụng), hệ điều hành thu hồi CPU khi tiến trình:</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">có độ ưu tiên thấp hơn tiến trình mới đưa vào.</span>"},{"letter":"B","html":"<span class=\"option-text\">có thời gian thực thi dài hơn quantum time.</span>"},{"letter":"C","html":"<span class=\"option-text\">bị chặn hoặc kết thúc trước khi hết quantum time.</span>"},{"letter":"D","html":"<span class=\"option-text\">Có thời gian thực thi ngắn.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Preemptive Priority thu hồi CPU khi có tiến trình mới có ưu tiên cao hơn tiến trình đang chạy. B là Round Robin, C là trường hợp tự rời CPU, D không phải tiêu chí của Priority.</p>"},{"id":"c3q39","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":39,"title":"Chương 3 · Câu 39","content":"<h2>Đối với những tiến trình có Burst time nhỏ, giải thuật điều phối tiến trình nào dưới đây cho thời gian chờ thấp nhất?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">First-Come, First-Served Scheduling</span>"},{"letter":"B","html":"<span class=\"option-text\">Shortest-Job-First Scheduling</span>"},{"letter":"C","html":"<span class=\"option-text\">Priority-scheduling</span>"},{"letter":"D","html":"<span class=\"option-text\">Multilevel queue-scheduling</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SJF ưu tiên tiến trình có burst nhỏ, nhờ vậy giảm waiting time trung bình. FCFS không xét burst, Priority xét độ ưu tiên, Multilevel Queue chia nhóm hàng đợi.</p>"},{"id":"c3q40","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":40,"title":"Chương 3 · Câu 40","content":"<h2>Đối với những tiến trình có Burst time nhỏ, giải thuật điều phối tiến trình SJF (Shortest Job First) có ưu điểm nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Định thời đơn giản nhất.</span>"},{"letter":"B","html":"<span class=\"option-text\">Không cần biết trước thời gian chạy công việc.</span>"},{"letter":"C","html":"<span class=\"option-text\">Thời gian chờ đợi trung bình nhỏ nhất.</span>"},{"letter":"D","html":"<span class=\"option-text\">Định thời tương đối phức tạp.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Ưu điểm nổi bật của SJF là tối ưu/giảm thời gian chờ trung bình. A không phải ưu điểm chính, B sai vì SJF cần ước lượng burst time, D là nhược điểm hơn là ưu điểm.</p>"},{"id":"c3q41","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":41,"title":"Chương 3 · Câu 41","content":"<h2>Với các hệ điều hành sử dụng luồng nhân (kernel threads) và luồng người dùng (User thread), giải thuật điều phối CPU áp dụng cho loại thread nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">user threads.</span>"},{"letter":"B","html":"<span class=\"option-text\">kernel threads.</span>"},{"letter":"C","html":"<span class=\"option-text\">kernel threads và user threads.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tùy theo người sử dụng.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>CPU scheduler của hệ điều hành nhìn thấy và lập lịch các kernel threads. User threads do thư viện luồng quản lý ở mức người dùng, không phải đối tượng trực tiếp của CPU scheduler kernel.</p>"},{"id":"c3q42","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":42,"title":"Chương 3 · Câu 42","content":"<h2>Với hệ điều hành dùng mô hình ánh xạ Many-to-One và Many-to-Many, thư viện luồng (thread library) có vai trò gì?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Tra cứu danh mục các luồng (thread).</span>"},{"letter":"B","html":"<span class=\"option-text\">Định thời cho luồng nhân (kernel threads).</span>"},{"letter":"C","html":"<span class=\"option-text\">Định thời cho luồng người dùng (user threads).</span>"},{"letter":"D","html":"<span class=\"option-text\">Định thời cho luồng nhân (kernel threads) và người dùng (user threads).</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Trong các mô hình có user-level scheduling, thư viện luồng định thời user threads. Kernel scheduler định thời kernel threads, nên B và D không đúng vai trò của thread library; A quá chung chung.</p>"},{"id":"c3q43","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":43,"title":"Chương 3 · Câu 43","content":"<h2>Trong các mô hình ánh xạ user thread vào kernel thread, mô hình nào chỉ xảy ra tranh chấp CPU tại các kernel threads?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Mô hình One-to-Many.</span>"},{"letter":"B","html":"<span class=\"option-text\">Mô hình One-to-One.</span>"},{"letter":"C","html":"<span class=\"option-text\">Mô hình Many-to-Many.</span>"},{"letter":"D","html":"<span class=\"option-text\">Mô hình Many-to-One.</span>"}],"correct":"B","note":"B","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Ở mô hình One-to-One, mỗi user thread tương ứng một kernel thread, nên việc cạnh tranh CPU do kernel thực hiện giữa các kernel threads. Many-to-One và Many-to-Many còn có phần lập lịch user-level.</p>"},{"id":"c3q44","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":44,"title":"Chương 3 · Câu 44","content":"<h2>Một Hệ điều hành chia hàng đợi Ready thành 2 hàng đợi con:\n- Foreground queue: chứa các process hiển thị trên màn hình.\n- Background queue: chứa các process chạy nền hoặc dạng Service.\nHệ điều hành trên sẽ chọn giải thuật điều phối đa hàng đợi (Multilevel Queue Scheduling) nào cho hợp lý?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Fixed priority scheduling.</span>"},{"letter":"B","html":"<span class=\"option-text\">Priority scheduling.</span>"},{"letter":"C","html":"<span class=\"option-text\">Time slice scheduling.</span>"},{"letter":"D","html":"<span class=\"option-text\">Round Robin scheduling.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Foreground thường cần ưu tiên cao hơn background để phản hồi tốt cho người dùng, nên fixed priority giữa các queue là lựa chọn hợp lý. Priority/Round Robin là giải thuật cho tiến trình hoặc trong từng queue; time slice phù hợp khi muốn chia CPU theo tỷ lệ giữa nhiều queue.</p>"},{"id":"c3q45","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":45,"title":"Chương 3 · Câu 45","content":"<h2>Một Hệ điều hành chia hàng đợi Ready thành nhiều hàng đợi con. Mỗi hàng đợi con dùng chứa những process có quan hệ chung. Hệ điều hành trên sẽ chọn giải thuật điều phối đa hàng đợi (Multilevel Queue Scheduling) nào cho hợp lý?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Fixed priority scheduling.</span>"},{"letter":"B","html":"<span class=\"option-text\">Priority scheduling.</span>"},{"letter":"C","html":"<span class=\"option-text\">Time slice scheduling.</span>"},{"letter":"D","html":"<span class=\"option-text\">Round Robin scheduling.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Khi có nhiều queue theo nhóm quan hệ chung, time slice giúp chia CPU cho các queue theo tỷ lệ, tránh để một nhóm chiếm hết CPU. A có thể gây đói cho queue ưu tiên thấp; B và D không phải cách phân phối CPU giữa nhiều queue trong trường hợp này.</p>"},{"id":"c3q46","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":46,"title":"Chương 3 · Câu 46","content":"<h2>Trong giải thuật định thời “đa bộ xử lý không đối xứng” (Asymmetric multiprocessing), có bao nhiêu bộ xử lý tham gia định thời và xử lý nhập/xuất?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Một bộ xử lý.</span>"},{"letter":"B","html":"<span class=\"option-text\">Hai bộ xử lý.</span>"},{"letter":"C","html":"<span class=\"option-text\">Bốn bộ xử lý.</span>"},{"letter":"D","html":"<span class=\"option-text\">Tất cả các bộ xử lý của hệ thống.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Asymmetric multiprocessing thường có một processor chủ điều khiển scheduling và I/O. Các processor khác thực hiện công việc được giao, nên B, C, D không đúng.</p>"},{"id":"c3q47","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":47,"title":"Chương 3 · Câu 47","content":"<h2>Trong giải thuật định thời “đa bộ xử lý đối xứng” (Symmetric multiprocessing), có bao nhiêu bộ xử lý tham gia định thời cho tiến trình?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Một bộ xử lý.</span>"},{"letter":"B","html":"<span class=\"option-text\">Hai bộ xử lý.</span>"},{"letter":"C","html":"<span class=\"option-text\">Bốn bộ xử lý.</span>"},{"letter":"D","html":"<span class=\"option-text\">Mỗi bộ xử lý tự định thời cho mình.</span>"}],"correct":"D","note":"D","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Trong SMP, các processor ngang hàng và mỗi processor có thể tự lập lịch để chọn tiến trình/luồng chạy. A, B, C chỉ nêu số cố định nên không đúng bản chất SMP.</p>"},{"id":"c3q48","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":48,"title":"Chương 3 · Câu 48","content":"<h2>Trong phương pháp định thời “đa bộ xử lý đối xứng”, có thể có các loại hàng đợi Ready nào?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Hàng đợi chung cho tất cả bộ xử lý.</span>"},{"letter":"B","html":"<span class=\"option-text\">Hàng đợi riêng của mỗi bộ xử lý.</span>"},{"letter":"C","html":"<span class=\"option-text\">Có cả hàng đợi chung và các hàng đợi riêng.</span>"},{"letter":"D","html":"<span class=\"option-text\">Không có hàng đợi.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>SMP có thể dùng một ready queue chung hoặc mỗi processor có queue riêng. Vì vậy phương án bao quát đúng là có cả hai kiểu; D sai vì vẫn cần hàng đợi ready.</p>"},{"id":"c3q49","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":49,"title":"Chương 3 · Câu 49","content":"<h2>Những nguyên tắc nào được sử dụng khi điều phối tiến trình cho hệ thống đa bộ xử lý?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Nguyên tắc Một bộ xử lý; nguyên tắc Cân bằng tải.</span>"},{"letter":"B","html":"<span class=\"option-text\">Nguyên tắc Chia sẻ thời gian; nguyên tắc FIFO.</span>"},{"letter":"C","html":"<span class=\"option-text\">Nguyên tắc Độ ưu tiên.</span>"},{"letter":"D","html":"<span class=\"option-text\">Nguyên tắc Chia sẻ thời gian thực.</span>"}],"correct":"A","note":"A","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Lập lịch đa bộ xử lý quan tâm đến gắn tiến trình với processor/processor affinity và cân bằng tải giữa các CPU. B, C, D là các chính sách lập lịch đơn lẻ, không đủ mô tả vấn đề đa bộ xử lý.</p>"},{"id":"c3q50","chapter":3,"chapterTitle":"Chương 3: Điều phối CPU","number":50,"title":"Chương 3 · Câu 50","content":"<h2>Khi điều phối tiến trình cho hệ thống đa bộ xử lý, phương pháp nào dưới đây được thực hiện để đảm bảo cân bằng tải (Load Balance) cho các CPU?</h2>","choices":[{"letter":"A","html":"<span class=\"option-text\">Push migration (đẩy công việc ra khỏi CPU).</span>"},{"letter":"B","html":"<span class=\"option-text\">Pull migration (lấy công việc vào CPU).</span>"},{"letter":"C","html":"<span class=\"option-text\">Push migration và Pull migration.</span>"},{"letter":"D","html":"<span class=\"option-text\">So sánh và điều chỉnh tải.</span>"}],"correct":"C","note":"C","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div><p>Load balancing có thể thực hiện bằng push migration (đẩy việc khỏi CPU quá tải) và pull migration (CPU rảnh kéo việc về). A hoặc B chỉ nêu một chiều; D là mô tả chung chứ không phải tên hai phương pháp cụ thể.</p>"}]</script>

  const QUESTIONS = JSON.parse(document.getElementById('quizData').textContent);
  const STORAGE_KEY = 'hdh_quiz_practice_v1';
  const state = { chapter: 'all', filter: 'all', search: '', answers: loadAnswers() };
  const els = {
    questions: document.getElementById('questions'), stats: document.getElementById('stats'), progress: document.getElementById('progressBar'),
    search: document.getElementById('search'), chapterTabs: document.getElementById('chapterTabs'), filterTabs: document.getElementById('filterTabs'),
    chapterSummary: document.getElementById('chapterSummary'), wrongPanel: document.getElementById('wrongPanel'), wrongList: document.getElementById('wrongList'),
    empty: document.getElementById('emptyState'), toTop: document.getElementById('toTop')
  };
  const chapterNames = {1:'Chương 1',2:'Chương 2',3:'Chương 3'};
  const filters = [
    ['all','Tất cả'], ['unanswered','Chưa làm'], ['correct','Đúng'], ['wrong','Sai']
  ];

  function loadAnswers(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}') || {}; }
    catch(e) { return {}; }
  }
  function saveAnswers(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state.answers)); }
  function stripTags(html){
    const div = document.createElement('div'); div.innerHTML = html || ''; return div.textContent || div.innerText || '';
  }
  function answerStatus(q){
    const chosen = state.answers[q.id];
    if(!chosen) return 'unanswered';
    if(q.correct === null) return 'wrong';
    return chosen === q.correct ? 'correct' : 'wrong';
  }
  function isVisibleByFilter(q){
    if(state.chapter !== 'all' && String(q.chapter) !== String(state.chapter)) return false;
    const st = answerStatus(q);
    if(state.filter !== 'all' && st !== state.filter) return false;
    const s = state.search.trim().toLowerCase();
    if(s) {
      const hay = [q.title, q.chapterTitle, stripTags(q.content), q.choices.map(c => c.letter + ' ' + stripTags(c.html)).join(' '), stripTags(q.explanation)].join(' ').toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  }
  function getCurrentSet(){ return QUESTIONS.filter(isVisibleByFilter); }
  function getStats(list){
    const total = list.length;
    let answered=0, correct=0, wrong=0;
    list.forEach(q => { const st = answerStatus(q); if(st !== 'unanswered') answered++; if(st === 'correct') correct++; if(st === 'wrong') wrong++; });
    return { total, answered, correct, wrong, unanswered: total - answered, percent: total ? Math.round(correct / total * 100) : 0 };
  }
  function renderTabs(){
    const ch = [['all','Tất cả'], ['1','Chương 1'], ['2','Chương 2'], ['3','Chương 3']];
    els.chapterTabs.innerHTML = ch.map(([id,label]) => `<button type="button" class="tab ${state.chapter===id?'active':''}" data-chapter="${id}">${label}</button>`).join('');
    els.filterTabs.innerHTML = filters.map(([id,label]) => `<button type="button" class="tab ${state.filter===id?'active':''}" data-filter="${id}">${label}</button>`).join('');
  }
  function renderStats(){
    const baseList = QUESTIONS.filter(q => state.chapter === 'all' || String(q.chapter) === String(state.chapter));
    const s = getStats(baseList);
    els.stats.innerHTML = `
      <div class="stat"><b>${s.total}</b><span>Tổng</span></div>
      <div class="stat"><b>${s.answered}</b><span>Đã làm</span></div>
      <div class="stat"><b>${s.correct}</b><span>Đúng</span></div>
      <div class="stat"><b>${s.wrong}</b><span>Sai</span></div>
      <div class="stat"><b>${s.percent}%</b><span>Tỉ lệ</span></div>`;
    els.progress.style.width = `${s.total ? Math.round(s.answered / s.total * 100) : 0}%`;
    const html = [1,2,3].map(ch => {
      const list = QUESTIONS.filter(q => q.chapter === ch); const cs = getStats(list);
      return `<div class="chapter-line"><strong>${chapterNames[ch]}</strong><span>${cs.answered}/${cs.total} đã làm · Đúng ${cs.correct} · Sai ${cs.wrong} · ${cs.percent}%</span></div>`;
    }).join('');
    els.chapterSummary.innerHTML = html;
    const wrong = QUESTIONS.filter(q => answerStatus(q) === 'wrong');
    els.wrongList.innerHTML = wrong.length ? wrong.map(q => `<a href="#${q.id}">C${q.chapter}-${q.number}</a>`).join('') : '<span style="color:#64748b;font-size:13px">Chưa có câu sai.</span>';
  }
  function renderQuestions(){
    const list = getCurrentSet();
    els.empty.classList.toggle('show', list.length === 0);
    els.questions.innerHTML = list.map(q => questionTemplate(q)).join('');
    renderStats();
  }
  function questionTemplate(q){
    const chosen = state.answers[q.id] || '';
    const st = answerStatus(q);
    const answered = !!chosen;
    const stateText = answered ? (st === 'correct' ? 'Đã chọn · Đúng' : 'Đã chọn · Sai') : 'Chưa làm';
    const choices = q.choices.map(c => {
      let cls = 'choice-btn';
      if(answered && c.letter === chosen) cls += st === 'correct' ? ' correct-choice' : ' wrong-choice';
      if(answered && q.correct && c.letter === q.correct && c.letter !== chosen) cls += ' correct-choice';
      if(!answered && c.letter === chosen) cls += ' selected';
      return `<button type="button" class="${cls}" data-qid="${q.id}" data-choice="${c.letter}"><span class="letter">${c.letter}</span><span>${c.html}</span></button>`;
    }).join('');
    const feedback = answered ? feedbackTemplate(q, chosen, st) : '';
    return `<article class="question-card" id="${q.id}" data-qid="${q.id}">
      <div class="q-head"><div class="q-title">${q.title}</div><div class="q-state">${stateText}</div></div>
      <div class="q-content">${q.content}</div>
      <div class="choices">${choices}</div>
      <div class="feedback ${answered?'show ':''}${st==='correct'?'ok':(answered && q.correct===null?'warn':(answered?'bad':''))}">${feedback}</div>
      <div class="card-actions"><button type="button" class="mini reset-one" data-qid="${q.id}">Làm lại câu này</button><a class="tab" href="#top">Đầu trang</a></div>
    </article>`;
  }
  function feedbackTemplate(q, chosen, st){
    let title = '';
    if(q.correct === null) title = `Câu này không có lựa chọn đúng trong A-D. Bạn đã chọn ${chosen}.`;
    else if(st === 'correct') title = `Đúng. Đáp án của bạn: ${chosen}.`;
    else title = `Sai. Bạn chọn ${chosen}, đáp án đúng là ${q.correct}.`;
    const note = q.note ? `<div class="special-note">${q.note}</div>` : '';
    const exp = q.explanation ? `<div class="explain">${q.explanation}</div>` : '';
    return `<div class="feedback-title">${title}</div>${note}${exp}`;
  }
  function refreshOne(qid){
    const q = QUESTIONS.find(x => x.id === qid); if(!q) return;
    const old = document.querySelector(`[data-qid="${qid}"].question-card`);
    if(old) old.outerHTML = questionTemplate(q);
    renderStats();
  }
  function setAnswer(qid, choice){
    state.answers[qid] = choice;
    saveAnswers();
    refreshOne(qid);
  }
  function resetQuestion(qid){ delete state.answers[qid]; saveAnswers(); refreshOne(qid); }
  function resetList(list){
    if(!list.length) return;
    list.forEach(q => delete state.answers[q.id]);
    saveAnswers(); renderQuestions();
  }

  els.questions.addEventListener('click', (e) => {
    const choiceBtn = e.target.closest('.choice-btn');
    if(choiceBtn) { setAnswer(choiceBtn.dataset.qid, choiceBtn.dataset.choice); return; }
    const resetBtn = e.target.closest('.reset-one');
    if(resetBtn) resetQuestion(resetBtn.dataset.qid);
  });
  els.chapterTabs.addEventListener('click', e => { const b=e.target.closest('[data-chapter]'); if(!b) return; state.chapter=b.dataset.chapter; renderTabs(); renderQuestions(); });
  els.filterTabs.addEventListener('click', e => { const b=e.target.closest('[data-filter]'); if(!b) return; state.filter=b.dataset.filter; renderTabs(); renderQuestions(); });
  els.search.addEventListener('input', () => { state.search = els.search.value; renderQuestions(); });
  document.getElementById('clearSearch').addEventListener('click', () => { els.search.value=''; state.search=''; renderQuestions(); });
  document.getElementById('toggleWrongList').addEventListener('click', () => els.wrongPanel.classList.toggle('show'));
  document.getElementById('resetVisible').addEventListener('click', () => {
    const list = getCurrentSet();
    if(confirm(`Làm lại ${list.length} câu đang hiển thị?`)) resetList(list);
  });
  document.getElementById('resetAll').addEventListener('click', () => {
    if(confirm('Xóa toàn bộ tiến độ và làm lại tất cả 132 câu?')) resetList(QUESTIONS);
  });
  els.toTop.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
  window.addEventListener('scroll', () => els.toTop.classList.toggle('show', window.scrollY > 450), {passive:true});

  renderTabs(); renderQuestions();
})();
</script>
</body>
</html>
