<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Trắc nghiệm HĐH - Luyện tập 3 chương</title>
<style>
  :root {
    --bg:#f4f6fb; --card:#ffffff; --text:#111827; --muted:#64748b; --line:#e5e7eb;
    --blue:#2563eb; --blue-soft:#eff6ff; --green:#16a34a; --green-soft:#dcfce7;
    --red:#dc2626; --red-soft:#fee2e2; --amber:#d97706; --amber-soft:#fef3c7;
    --shadow:0 8px 24px rgba(15,23,42,.08); --radius:17px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.48;-webkit-font-smoothing:antialiased}
  .wrap{width:min(980px,100%);margin:0 auto;padding:12px 10px 92px}
  .hero{background:linear-gradient(135deg,#eff6ff,#fff 55%,#f0fdf4);border:1px solid var(--line);border-radius:20px;padding:15px;box-shadow:var(--shadow);margin-bottom:10px}
  .hero h1{margin:0 0 6px;color:#1d4ed8;font-size:20px;line-height:1.2}
  .hero p{margin:0;color:var(--muted);font-size:13px}
  .toolbar{position:sticky;top:0;z-index:50;background:rgba(244,246,251,.95);backdrop-filter:blur(12px);padding:8px 0 9px;border-bottom:1px solid rgba(229,231,235,.65)}
  .search-row{display:flex;gap:8px;align-items:center}
  #search{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:10px 12px;font-size:14px;outline:none}
  #search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.13)}
  .btn-row,.chapter-tabs,.filter-tabs{display:flex;gap:7px;overflow-x:auto;padding:7px 1px 1px;scrollbar-width:thin}
  button,.tab{border:1px solid var(--line);background:#fff;color:#111827;border-radius:999px;padding:8px 11px;font-weight:750;font-size:12.5px;white-space:nowrap;cursor:pointer;box-shadow:0 2px 8px rgba(15,23,42,.04)}
  button:active,.tab:active,.choice-btn:active{transform:translateY(1px)}
  .tab.active{background:#111827;color:#fff;border-color:#111827}
  .stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:9px 0 10px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 6px;text-align:center;box-shadow:0 3px 12px rgba(15,23,42,.04)}
  .stat b{display:block;font-size:17px;line-height:1.1}
  .stat span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
  .progress{height:9px;border-radius:999px;overflow:hidden;background:#e5e7eb;border:1px solid #dbe0e8}
  .progress > div{height:100%;width:0;background:linear-gradient(90deg,#2563eb,#16a34a);transition:width .22s ease}
  .chapter-summary{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;box-shadow:var(--shadow)}
  .chapter-summary h2{margin:0 0 8px;font-size:15px}
  .chapter-grid{display:grid;grid-template-columns:1fr;gap:7px}
  .chapter-line{display:flex;gap:7px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:12px;padding:8px;background:#fafafa;font-size:13px}
  .chapter-line strong{color:#1f2937}
  .chapter-line span{color:var(--muted)}
  .wrong-panel{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;margin:10px 0;box-shadow:var(--shadow)}
  .wrong-panel.show{display:block}
  .wrong-panel h2{margin:0 0 8px;font-size:15px}
  .wrong-list{display:flex;flex-wrap:wrap;gap:7px}
  .wrong-list a{text-decoration:none;border:1px solid #fecaca;background:#fff1f2;color:#b91c1c;border-radius:999px;padding:7px 10px;font-size:12px;font-weight:800}
  .question-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin:11px 0;box-shadow:var(--shadow);scroll-margin-top:150px}
  .question-card.hidden{display:none}
  .q-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
  .q-title{display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:var(--blue-soft);color:#1d4ed8;padding:5px 10px;font-size:12px;font-weight:900}
  .q-state{font-size:12px;color:var(--muted);font-weight:800}
  .q-content p,.q-content h2{margin:7px 0 10px;font-size:15.5px;line-height:1.42;font-weight:650}
  .q-content h2{font-size:16px}
  .choices{display:grid;gap:8px;margin-top:10px}
  .choice-btn{width:100%;display:grid;grid-template-columns:32px 1fr;gap:8px;align-items:start;text-align:left;border:1px solid var(--line);border-radius:14px;padding:9px 10px;background:#fff;color:var(--text);font-size:14.5px;font-weight:500;white-space:normal;box-shadow:none}
  .letter{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:999px;background:#f1f5f9;color:#334155;font-weight:900}
  .choice-btn.selected{border-color:#2563eb;background:#eff6ff}
  .choice-btn.selected .letter{background:#2563eb;color:white}
  .choice-btn.correct-choice{border-color:#16a34a;background:#dcfce7;color:#052e16;font-weight:750}
  .choice-btn.correct-choice .letter{background:#16a34a;color:white}
  .choice-btn.wrong-choice{border-color:#dc2626;background:#fee2e2;color:#7f1d1d;font-weight:750}
  .choice-btn.wrong-choice .letter{background:#dc2626;color:white}
  .feedback{display:none;margin-top:10px;border-radius:14px;border:1px solid var(--line);padding:10px;background:#f8fafc}
  .feedback.show{display:block}
  .feedback.ok{background:#f0fdf4;border-color:#86efac;color:#14532d}
  .feedback.bad{background:#fff1f2;border-color:#fecaca;color:#7f1d1d}
  .feedback.warn{background:#fffbeb;border-color:#fde68a;color:#78350f}
  .feedback-title{font-weight:900;margin-bottom:5px}
  .explain{margin-top:8px;border-top:1px dashed rgba(100,116,139,.35);padding-top:8px;color:#334155}
  .explain p{margin:6px 0}
  .ex-title{font-weight:900;color:#111827;margin-bottom:4px}
  .card-actions{display:flex;gap:7px;margin-top:9px;flex-wrap:wrap}
  .mini{padding:7px 10px;font-size:12px;background:#f9fafb}
  .diagram-wrap{border:1px solid var(--line);background:#fff;border-radius:14px;margin:8px 0 12px;padding:8px;overflow-x:auto}
  .diagram-img,.timeline{width:100%;min-width:440px;height:auto;display:block;border-radius:10px}
  .process-table-wrap{overflow-x:auto;margin:8px 0 10px}
  .process-table{width:auto;border-collapse:collapse;background:#f0fdf4;color:#064e3b;font-size:13px;font-weight:700;border-radius:10px;overflow:hidden}
  .process-table th,.process-table td{border:1px solid rgba(5,150,105,.25);padding:4px 8px;text-align:left;white-space:nowrap}
  .special-note{margin-top:8px;border-left:4px solid #dc2626;background:#fff1f2;color:#b91c1c;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:700}
  mark{background:#e0f2fe;color:inherit;border-radius:3px;padding:0 2px}
  .empty{display:none;text-align:center;color:var(--muted);padding:18px 10px;background:#fff;border:1px dashed var(--line);border-radius:16px;margin:12px 0}
  .empty.show{display:block}
  .float-top{position:fixed;right:13px;bottom:16px;z-index:70;border:none;background:#111827;color:#fff;border-radius:999px;min-width:42px;height:42px;padding:0 13px;box-shadow:0 10px 24px rgba(15,23,42,.25);display:none}
  .float-top.show{display:inline-flex;align-items:center;justify-content:center}
  @media(max-width:480px){
    body{font-size:14px}
    .wrap{padding-left:9px;padding-right:9px}
    .hero{padding:13px;border-radius:17px}
    .hero h1{font-size:18px}
    .stats{grid-template-columns:repeat(5,1fr);gap:5px}
    .stat{padding:7px 3px;border-radius:12px}
    .stat b{font-size:15.5px}
    .stat span{font-size:10px}
    .question-card{border-radius:16px;padding:11px}
    .choice-btn{grid-template-columns:29px 1fr;padding:8px 9px;font-size:14px}
    .q-content p,.q-content h2{font-size:14.5px}
    .chapter-line{align-items:flex-start;flex-direction:column;gap:3px}
  }
  @media(min-width:700px){
    .wrap{padding-left:16px;padding-right:16px}
    .chapter-grid{grid-template-columns:repeat(3,1fr)}
    .choice-btn{font-size:15px}
  }
  @media(print){.toolbar,.card-actions,.float-top{display:none!important}body{background:#fff}.question-card,.hero,.chapter-summary{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap" id="top">
  <section class="hero">
    <h1>Trắc nghiệm HĐH - Luyện tập 3 chương</h1>
    <p>Gộp 3 chương · Chọn đáp án để biết đúng/sai ngay · Có giải thích sau khi trả lời · Tự lưu tiến độ trên trình duyệt.</p>
  </section>

  <section class="toolbar" aria-label="Bảng điều khiển luyện tập">
    <div class="search-row"><input id="search" type="search" placeholder="Tìm câu hỏi, đáp án, ví dụ: Round Robin, Kernel, Câu 30..." autocomplete="off"></div>
    <div class="chapter-tabs" id="chapterTabs"></div>
    <div class="filter-tabs" id="filterTabs"></div>
    <div class="stats" id="stats"></div>
    <div class="progress" aria-label="Tiến độ"><div id="progressBar"></div></div>
    <div class="btn-row">
      <button type="button" id="clearSearch">Xóa tìm kiếm</button>
      <button type="button" id="toggleWrongList">Câu sai</button>
      <button type="button" id="resetVisible">Làm lại phần đang xem</button>
      <button type="button" id="resetAll">Làm lại tất cả</button>
    </div>
  </section>

  <section class="chapter-summary">
    <h2>Thống kê theo chương</h2>
    <div class="chapter-grid" id="chapterSummary"></div>
  </section>

  <section class="wrong-panel" id="wrongPanel">
    <h2>Danh sách câu sai</h2>
    <div class="wrong-list" id="wrongList"></div>
  </section>

  <main id="questions"></main>
  <div class="empty" id="emptyState">Không có câu nào khớp với bộ lọc hiện tại.</div>
</div>
<button class="float-top" id="toTop" type="button">↑</button>
<script id="quizData" type="application/json">[{"id":"c1q1","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":1,"title":"Chương 1 · Câu 1","content":"<p class=\"question-text\">Phát biểu nào dưới đây KHÔNG ĐÚNG về Hệ điều hành?</p>","choices":[{"letter":"A","html":"<span>Hệ điều hành quản lý các phần cứng máy tính.</span>"},{"letter":"B","html":"<span>Hệ điều hành trực tiếp điều khiển hoạt động cho từng thiết bị phần cứng.</span>"},{"letter":"C","html":"<span>Hệ điều hành hỗ trợ phần mềm giao tiếp phần cứng trên máy tính.</span>"},{"letter":"D","html":"<span>Hệ điều hành hỗ trợ người dùng điều hành máy tính.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ điều hành quản lý và điều phối tài nguyên phần cứng, nhưng không trực tiếp điều khiển chi tiết mọi thiết bị theo cách riêng lẻ; việc đó thường thông qua trình điều khiển thiết bị. A, C, D đều mô tả đúng vai trò quản lý, trung gian và hỗ trợ người dùng của hệ điều hành.</p>"},{"id":"c1q2","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":2,"title":"Chương 1 · Câu 2","content":"<p class=\"question-text\">Điều gì là đúng khi một máy tính không có Hệ điều hành</p>","choices":[{"letter":"A","html":"<span>Các ứng dụng vẫn chạy bình thường trên máy tính đó.</span>"},{"letter":"B","html":"<span>CPU vẫn tiếp nhận và thực thi các lệnh từ người dùng.</span>"},{"letter":"C","html":"<span>Các ứng dụng và lệnh người dùng không thể thực thi trên máy tính.</span>"},{"letter":"D","html":"<span>Người dùng vẫn cài đặt phần mềm vào máy tính như bình thường.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Không có hệ điều hành thì người dùng và ứng dụng không có môi trường chuẩn để nạp, chạy lệnh, quản lý thiết bị và tệp. A, B, D sai vì đều giả định máy vẫn hoạt động bình thường như khi có hệ điều hành.</p>"},{"id":"c1q3","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":3,"title":"Chương 1 · Câu 3","content":"<p class=\"question-text\">Trong phân lớp hệ thống máy tính, Hệ điều hành thuộc vị trí nào</p>","choices":[{"letter":"A","html":"<span>Hệ điều hành thuộc lớp cuối cùng, kế trên là lớp phần cứng.</span>"},{"letter":"B","html":"<span>Hệ điều hành thuộc lớp trên cùng, kế dưới là lớp ứng dụng.</span>"},{"letter":"C","html":"<span>Hệ điều hành nằm giữa lớp phần cứng và lớp ứng dụng.</span>"},{"letter":"D","html":"<span>Hệ điều hành nằm giữa lớp phần cứng và lớp người dùng.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Trong mô hình phân lớp cơ bản, phần cứng ở dưới, hệ điều hành ở giữa và ứng dụng ở phía trên. A, B sai vị trí; D nói gần đúng nhưng bỏ qua lớp ứng dụng nên không chính xác bằng C.</p>"},{"id":"c1q4","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":4,"title":"Chương 1 · Câu 4","content":"<p class=\"question-text\">Dưới góc độ cơ bản, Hệ điều hành được định nghĩa là:</p>","choices":[{"letter":"A","html":"<span>là một phần mềm chạy trên máy tính</span>"},{"letter":"B","html":"<span>là một chương trình quản lý phần cứng máy tính.</span>"},{"letter":"C","html":"<span>là một chương trình bảo vệ phần cứng máy tính</span>"},{"letter":"D","html":"<span>là một phần mềm quản lý các phần mềm khác.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Định nghĩa cơ bản thường xem hệ điều hành là chương trình quản lý phần cứng và tài nguyên máy tính. A quá chung vì mọi phần mềm đều chạy trên máy tính; C chỉ nói bảo vệ phần cứng; D chỉ nói đến quản lý phần mềm nên chưa đủ.</p>"},{"id":"c1q5","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":5,"title":"Chương 1 · Câu 5","content":"<p class=\"question-text\">Trong các thành phần của hệ thống máy tính, thành phần nào trực tiếp quản lý các tài nguyên phần cứng:</p>","choices":[{"letter":"A","html":"<span>Người dùng</span>"},{"letter":"B","html":"<span>Các phần mềm</span>"},{"letter":"C","html":"<span>Hệ điều hành</span>"},{"letter":"D","html":"<span>Dữ liệu</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ điều hành chịu trách nhiệm quản lý CPU, bộ nhớ, thiết bị vào/ra và các tài nguyên phần cứng khác. Người dùng, phần mềm ứng dụng và dữ liệu không trực tiếp quản lý tài nguyên phần cứng.</p>"},{"id":"c1q6","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":6,"title":"Chương 1 · Câu 6","content":"<p class=\"question-text\">Chức năng của Hệ điều hành là gì?</p>","choices":[{"letter":"A","html":"<span>Cấp phát tài nguyên phần cứng cho các ứng dụng.</span>"},{"letter":"B","html":"<span>Điều khiển, định thời thực thi các chương trình.</span>"},{"letter":"C","html":"<span>Hỗ trợ người dùng giao tiếp với máy tính.</span>"},{"letter":"D","html":"<span>tất cả các tính năng trên.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ điều hành vừa cấp phát tài nguyên, vừa điều khiển/định thời chương trình, vừa cung cấp giao diện để người dùng làm việc với máy tính. Vì vậy A, B, C đều đúng và D là lựa chọn tổng hợp.</p>"},{"id":"c1q7","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":7,"title":"Chương 1 · Câu 7","content":"<p class=\"question-text\">Kernel của Hệ điều hành là gì?</p>","choices":[{"letter":"A","html":"<span>là lớp nhân quản lý, điều phối các chương trình, phần cứng.</span>"},{"letter":"B","html":"<span>là các chương trình điều khiển thiết bị phần cứng.</span>"},{"letter":"C","html":"<span>là các ứng dụng.</span>"},{"letter":"D","html":"<span>là trình biên dịch.</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Kernel là phần lõi của hệ điều hành, quản lý và điều phối chương trình, bộ nhớ, CPU và phần cứng. B chỉ là driver, C là ứng dụng, D là trình biên dịch nên không phải kernel.</p>"},{"id":"c1q8","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":8,"title":"Chương 1 · Câu 8","content":"<p class=\"question-text\">Shell của Hệ điều hành là gì?</p>","choices":[{"letter":"A","html":"<span>là lớp nhân quản lý, điều phối các chương trình, phần cứng.</span>"},{"letter":"B","html":"<span>là các chương trình điều khiển thiết bị phần cứng.</span>"},{"letter":"C","html":"<span>là lớp chương trình hỗ trợ giao tiếp của người dùng với Kernel.</span>"},{"letter":"D","html":"<span>là trình biên dịch.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Shell là lớp giao tiếp giúp người dùng đưa lệnh tới kernel và nhận kết quả. A mô tả kernel, B mô tả driver, D là compiler nên không đúng.</p>"},{"id":"c1q9","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":9,"title":"Chương 1 · Câu 9","content":"<p class=\"question-text\">Trong hệ thống máy tính, người dùng phát lệnh cho Hệ điều hành thực thi thông qua lớp nào?</p>","choices":[{"letter":"A","html":"<span>Lớp Shell.</span>"},{"letter":"B","html":"<span>Lớp Driver.</span>"},{"letter":"C","html":"<span>Lớp Kernel.</span>"},{"letter":"D","html":"<span>Lớp Hardware.</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Người dùng thường nhập lệnh hoặc thao tác qua shell/giao diện để yêu cầu hệ điều hành thực thi. Driver, kernel và phần cứng không phải lớp giao tiếp trực tiếp chính cho người dùng.</p>"},{"id":"c1q10","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":10,"title":"Chương 1 · Câu 10","content":"<p class=\"question-text\">Vai trò của trình biên dịch (Compilers) bên trong một Hệ điều hành là gì?</p>","choices":[{"letter":"A","html":"<span>Biên dịch các lệnh của Driver để điều khiển phần cứng,</span>"},{"letter":"B","html":"<span>Biên dịch các lệnh của Applications để CPU thực thi,</span>"},{"letter":"C","html":"<span>Biên dịch các lệnh của Kernel để quản lý ứng dụng.</span>"},{"letter":"D","html":"<span>Biên dịch các lệnh của Users để điều khiển phần cứng.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Compiler chuyển mã/lệnh của chương trình ứng dụng sang dạng máy có thể thực thi. A, C, D không phù hợp vì compiler không phải công cụ trực tiếp điều khiển driver, kernel hay lệnh người dùng theo nghĩa đó.</p>"},{"id":"c1q11","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":11,"title":"Chương 1 · Câu 11","content":"<p class=\"question-text\">Để đáp ứng vai trò của Hệ điều hành, kiến trúc cơ bản của Hệ điều hành gồm các thành phần:</p>","choices":[{"letter":"A","html":"<span>Nhân, vỏ, giao diện người dùng.</span>"},{"letter":"B","html":"<span>Bộ khởi động, nhân, bộ lập trình vỏ.</span>"},{"letter":"C","html":"<span>Bộ cấp tài nguyên, chương trình kiểm soát, nhân (kernel).</span>"},{"letter":"D","html":"<span>Nhân, vỏ, hệ thống vector ngắt, bộ định thời.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Các thành phần/khía cạnh cốt lõi để hệ điều hành thực hiện vai trò là cấp phát tài nguyên, kiểm soát hoạt động và phần nhân kernel. A nghiêng về lớp giao tiếp, B và D lẫn các thành phần không phải bộ ba vai trò cơ bản của hệ điều hành.</p>"},{"id":"c1q12","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":12,"title":"Chương 1 · Câu 12","content":"<p class=\"question-text\">Command Prompt trong Hệ điều hành Windows là dạng gì?</p>","choices":[{"letter":"A","html":"<span>là lớp Shell đặt trong Kernel.</span>"},{"letter":"B","html":"<span>là lớp Kernel dưới dạng ứng dụng.</span>"},{"letter":"C","html":"<span>là lớp Kernel đặt trong Shell.</span>"},{"letter":"D","html":"<span>là lớp Shell dưới dạng một ứng dụng.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Command Prompt là chương trình dòng lệnh để người dùng giao tiếp với hệ điều hành, tức shell ở dạng ứng dụng. A, B, C sai vì gán shell/kernel vào sai vị trí.</p>"},{"id":"c1q13","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":13,"title":"Chương 1 · Câu 13","content":"<p class=\"question-text\">Command Prompt trong Hệ điều hành MS-DOS là dạng gì?</p>","choices":[{"letter":"A","html":"<span>là lớp Shell đặt trong Kernel.</span>"},{"letter":"B","html":"<span>là lớp Kernel dưới dạng ứng dụng.</span>"},{"letter":"C","html":"<span>là lớp Kernel đặt trong Shell.</span>"},{"letter":"D","html":"<span>là lớp Shell dưới dạng một ứng dụng.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Command Prompt/command interpreter của MS-DOS đóng vai trò shell để nhận lệnh người dùng. Nó không phải kernel, cũng không phải kernel nằm trong shell nên A, B, C không phù hợp.</p>"},{"id":"c1q14","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":14,"title":"Chương 1 · Câu 14","content":"<p class=\"question-text\">Terminal trong Hệ điều hành Linux là dạng gì?</p>","choices":[{"letter":"A","html":"<span>là lớp Shell đặt trong Kernel.</span>"},{"letter":"B","html":"<span>là lớp Kernel dưới dạng ứng dụng.</span>"},{"letter":"C","html":"<span>là lớp Kernel đặt trong Shell.</span>"},{"letter":"D","html":"<span>là lớp Shell dưới dạng một ứng dụng.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Terminal/shell trên Linux là chương trình người dùng dùng để nhập lệnh và giao tiếp với hệ điều hành. Nó không nằm trong kernel và không phải kernel, nên A, B, C sai.</p>"},{"id":"c1q15","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":15,"title":"Chương 1 · Câu 15","content":"<p class=\"question-text\">Hệ điều hành Windows 10 cung cấp giao diện người dùng (User interface) theo dạng nào?</p>","choices":[{"letter":"A","html":"<span>Command line interface (CLI).</span>"},{"letter":"B","html":"<span>Graphic User Interface (GUI)</span>"},{"letter":"C","html":"<span>Cả 2 dạng GUI và CLI</span>"},{"letter":"D","html":"<span>Window User Interface (WUI)</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Windows 10 có giao diện đồ họa GUI và cũng có công cụ dòng lệnh như Command Prompt/PowerShell. A và B chỉ nêu một dạng, D không phải cách phân loại chuẩn trong câu hỏi.</p>"},{"id":"c1q16","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":16,"title":"Chương 1 · Câu 16","content":"<p class=\"question-text\">Lịch sử phát triển của Hệ điều hành bùng nổ trong theo thời đại công nghệ điện tử nào?</p>","choices":[{"letter":"A","html":"<span>công nghệ điện tử dùng đèn chân không (vacuum</span>"},{"letter":"B","html":"<span>công nghệ điện tử dùng bán dẫn (transistors)</span>"},{"letter":"C","html":"<span>công nghệ điện tử dùng mạch tích hợp (Integrated Circuits – IC)</span>"},{"letter":"D","html":"<span>công nghệ điện tử dùng VLSI (Very large-scale integration)</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Giai đoạn mạch tích hợp IC gắn với sự phát triển mạnh của hệ điều hành, đa chương và chia sẻ thời gian. A là giai đoạn rất sớm, B chủ yếu gắn với batch system ban đầu, D là giai đoạn máy tính cá nhân/vi xử lý phát triển sau đó.</p>"},{"id":"c1q17","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":17,"title":"Chương 1 · Câu 17","content":"<p class=\"question-text\">Hệ điều hành thực hiện các tác vụ lần lượt theo những chỉ thị đã được xác định trước. Tên gọi của Hệ điều hành đó là:</p>","choices":[{"letter":"A","html":"<span>Hệ điều hành xử lý theo lô đơn giản</span>"},{"letter":"B","html":"<span>Hệ điều hành xử lý đa chương</span>"},{"letter":"C","html":"<span>Hệ điều hành chia sẻ thời gian</span>"},{"letter":"D","html":"<span>Hệ điều hành xử lý thời gian thực</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Xử lý theo lô đơn giản thực hiện các công việc theo trình tự đã chuẩn bị trước. B liên quan nhiều chương trình trong bộ nhớ, C chia sẻ CPU theo lát thời gian, D chú trọng đáp ứng thời gian thực.</p>"},{"id":"c1q18","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":18,"title":"Chương 1 · Câu 18","content":"<p class=\"question-text\">Đâu là ưu điểm chính của Hệ thống xử lý đa chương (multiprogramming system)?</p>","choices":[{"letter":"A","html":"<span>Chương trình khi nạp vào bộ nhớ sẽ được xử lý hoàn thành ngay lập tức</span>"},{"letter":"B","html":"<span>Hệ thống chạy được nhiều chương trình cùng lúc.</span>"},{"letter":"C","html":"<span>Không cần thiết lập định thời công việc (job scheduling) và quản lý bộ nhớ</span>"},{"letter":"D","html":"<span>Tối ưu sử dụng bộ nhớ</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Đa chương cho phép nhiều chương trình cùng tồn tại/chạy xen kẽ để tận dụng CPU. A sai vì không đảm bảo hoàn thành ngay; C sai vì vẫn cần định thời và quản lý bộ nhớ; D chỉ là lợi ích phụ, không phải ưu điểm chính bằng B.</p>"},{"id":"c1q19","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":19,"title":"Chương 1 · Câu 19","content":"<p class=\"question-text\">Mục đích chính của Hệ thống xử lý đa chương (multiprogramming system) là gì?</p>","choices":[{"letter":"A","html":"<span>Thực hiện đồng thời nhiều chương trình.</span>"},{"letter":"B","html":"<span>Tận dụng thời gian nhàn rỗi của CPU.</span>"},{"letter":"C","html":"<span>Chia sẻ thời gian giữa các chương trình.</span>"},{"letter":"D","html":"<span>Tận dụng RAM, ROM khi đọc ghi</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Mục tiêu chính của multiprogramming là giữ CPU bận bằng cách chuyển sang chương trình khác khi một chương trình chờ I/O. A là biểu hiện, C nghiêng về time-sharing, D không đúng trọng tâm.</p>"},{"id":"c1q20","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":20,"title":"Chương 1 · Câu 20","content":"<p class=\"question-text\">Điều kiện nào sau đây KHÔNG CẦN cho hoạt động đa chương của hệ điều hành?</p>","choices":[{"letter":"A","html":"<span>Định thời CPU (CPU scheduling).</span>"},{"letter":"B","html":"<span>Quản lý bộ nhớ (memory management).</span>"},{"letter":"C","html":"<span>Cấp phát tài nguyên (đĩa, máy in…).</span>"},{"letter":"D","html":"<span>Ứng dụng được lập trình đa nhiệm.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Đa chương là cơ chế của hệ điều hành nên cần định thời CPU, quản lý bộ nhớ và cấp phát tài nguyên. Ứng dụng không bắt buộc phải tự được lập trình đa nhiệm để hệ điều hành chạy nhiều chương trình xen kẽ.</p>"},{"id":"c1q21","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":21,"title":"Chương 1 · Câu 21","content":"<p class=\"question-text\">Phát biểu nào sau đây không đúng với hệ thống chia sẻ thời gian (time-sharing)?</p>","choices":[{"letter":"A","html":"<span>time-sharing là một hệ thống đa nhiệm (multi-tasking).</span>"},{"letter":"B","html":"<span>time-sharing yêu cầu thời gian chuyển đổi giữa các tác vụ rất ngắn.</span>"},{"letter":"C","html":"<span>time-sharing yêu cầu phải định thời CPU.</span>"},{"letter":"D","html":"<span>time-sharing yêu cầu hoàn thành xong nhiệm vụ 1 mới chia sẻ cho nhiệm vụ 2.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Time-sharing chia CPU thành các lát thời gian ngắn để nhiều tác vụ/người dùng được phục vụ xen kẽ, không chờ xong hẳn nhiệm vụ 1 mới chuyển. A, B, C đều là đặc điểm đúng của time-sharing.</p>"},{"id":"c1q22","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":22,"title":"Chương 1 · Câu 22","content":"<p class=\"question-text\">Hệ điều hành nào sau đây đòi hỏi phải thực hiện đầy đủ các tác vụ: Quản lý tiến trình, Định thời CPU, Quản lý bộ nhớ, Quản lý cấp phát tài nguyên, Quản lý file?</p>","choices":[{"letter":"A","html":"<span>Hệ điều hành xử lý đơn chương.</span>"},{"letter":"B","html":"<span>Hệ điều hành xử lý theo lô đơn giản</span>"},{"letter":"C","html":"<span>Hệ điều hành xử lý đa chương.</span>"},{"letter":"D","html":"<span>Hệ điều hành xử lý chia sẻ thời gian (Time-sharing).</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Time-sharing cần đầy đủ quản lý tiến trình, định thời CPU, bộ nhớ, tài nguyên và file để phục vụ nhiều tác vụ/người dùng tương tác. A và B đơn giản hơn; C có nhiều yêu cầu nhưng chưa thể hiện đầy đủ mức tương tác của time-sharing.</p>"},{"id":"c1q23","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":23,"title":"Chương 1 · Câu 23","content":"<p class=\"question-text\">Trong hệ thống xử lý đa nhiệm (multitasking), việc chuyển đổi giữa các công việc diễn ra:</p>","choices":[{"letter":"A","html":"<span>Sau một khoảng thời gian tùy theo công việc yêu cầu.</span>"},{"letter":"B","html":"<span>Chuyển đổi khi có công việc khác cần xử lý.</span>"},{"letter":"C","html":"<span>Luân phiên xoay vòng hoàn thành từng công việc.</span>"},{"letter":"D","html":"<span>Luân phiên xoay vòng, không đợi công việc hoàn thành.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Đa nhiệm chuyển đổi giữa các công việc theo cơ chế luân phiên/lát thời gian mà không cần đợi một công việc hoàn thành. A, B chưa nêu đúng cơ chế chung; C sai vì đợi hoàn thành từng công việc.</p>"},{"id":"c1q24","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":24,"title":"Chương 1 · Câu 24","content":"<p class=\"question-text\">Trong các mô hình hệ điều hành dưới đây, loại dùng cho hệ thống có nhiều bộ xử lí cùng chia sẻ hệ thống đường truyền, dữ liệu, bộ nhớ, các thiết bị ngoại vi?</p>","choices":[{"letter":"A","html":"<span>Hệ thống xử lí đa chương</span>"},{"letter":"B","html":"<span>Hệ thống xử lí đa nhiệm</span>"},{"letter":"C","html":"<span>Hệ thống xử lí song song</span>"},{"letter":"D","html":"<span>Hệ thống xử lí thời gian thực</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ thống xử lí song song dùng nhiều bộ xử lí cùng chia sẻ tài nguyên để xử lí công việc. A là nhiều chương trình, B là nhiều tác vụ, D là yêu cầu đáp ứng thời gian thực nên không đúng mô tả trong câu.</p>"},{"id":"c1q25","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":25,"title":"Chương 1 · Câu 25","content":"<p class=\"question-text\">Phát biểu nào sau đây không đúng với Hệ điều hành xử lý song song?</p>","choices":[{"letter":"A","html":"<span>Hệ điều hành có khả năng xử lý 2 hay nhiều tiến trình cùng lúc.</span>"},{"letter":"B","html":"<span>Hệ điều hành dùng cho máy có 2 hoặc nhiều bộ xử lý (CPU).</span>"},{"letter":"C","html":"<span>Hệ điều hành dùng cho nhiều bộ xử lý cùng chia sẻ một bộ nhớ.</span>"},{"letter":"D","html":"<span>Hệ điều hành dùng cho nhiều bộ xử lý cùng chia sẻ nhiều tiến trình.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ thống xử lý song song chia sẻ tài nguyên như bộ nhớ/hệ thống bus để xử lý đồng thời, nhưng không diễn đạt là các bộ xử lý “chia sẻ nhiều tiến trình” như một tài nguyên. A, B, C đều phù hợp với mô hình xử lý song song.</p>"},{"id":"c1q26","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":26,"title":"Chương 1 · Câu 26","content":"<p class=\"question-text\">Hệ thống đa bộ xử lý (multi-processors) có đặc điểm:</p>","choices":[{"letter":"A","html":"<span>Xử lý các công việc thực sự đồng thời.</span>"},{"letter":"B","html":"<span>Mỗi bộ xử lý có bộ nhớ riêng.</span>"},{"letter":"C","html":"<span>Mỗi bộ xử lý có đường truyền dữ liệu riêng.</span>"},{"letter":"D","html":"<span>Xếp hàng xử lý các công việc.</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Nhiều bộ xử lý cho phép thực hiện công việc thật sự đồng thời. B và C phù hợp hơn với hệ phân tán/kiến trúc riêng rẽ; D là cách xử lý tuần tự nên không phải đặc điểm chính của multiprocessors.</p>"},{"id":"c1q27","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":27,"title":"Chương 1 · Câu 27","content":"<p class=\"question-text\">Hệ thống đa bộ xử lý (multi-processors) được phân loại thành các hệ thống:</p>","choices":[{"letter":"A","html":"<span>Đồng bộ và bất đồng bộ.</span>"},{"letter":"B","html":"<span>Đối xứng và bất đối xứng.</span>"},{"letter":"C","html":"<span>Kết hợp và không kết hợp.</span>"},{"letter":"D","html":"<span>Không phân loại.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ đa bộ xử lý thường được phân loại thành đối xứng và bất đối xứng. Các cặp ở A, C không phải phân loại chuẩn trong ngữ cảnh này; D sai vì có phân loại.</p>"},{"id":"c1q28","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":28,"title":"Chương 1 · Câu 28","content":"<p class=\"question-text\">Hệ thống xử lý phân tán có đặc điểm:</p>","choices":[{"letter":"A","html":"<span>Mỗi bộ xử lý có bộ nhớ riêng.</span>"},{"letter":"B","html":"<span>Các bộ xử lý độc lập không liên hệ nhau.</span>"},{"letter":"C","html":"<span>Một công việc chia đều cho các bộ xử lý.</span>"},{"letter":"D","html":"<span>Dùng chung bộ nhớ kết nối thành mạng.</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Trong hệ phân tán, các bộ xử lý/máy thường có bộ nhớ riêng và liên lạc qua mạng. B sai vì vẫn có liên hệ qua mạng; C nghiêng về xử lý song song; D sai vì hệ phân tán không dùng chung bộ nhớ theo nghĩa chặt chẽ.</p>"},{"id":"c1q29","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":29,"title":"Chương 1 · Câu 29","content":"<p class=\"question-text\">Hệ thống xử lý phân tán được phân loại:</p>","choices":[{"letter":"A","html":"<span>Đồng bộ và bất đồng bộ.</span>"},{"letter":"B","html":"<span>Peer-to-peer và client-server.</span>"},{"letter":"C","html":"<span>Kết hợp và không kết hợp.</span>"},{"letter":"D","html":"<span>Đối xứng và bất đối xứng.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Hệ phân tán thường được tổ chức theo mô hình peer-to-peer hoặc client-server. A, C, D không phải cách phân loại chính được hỏi ở đây.</p>"},{"id":"c1q30","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":30,"title":"Chương 1 · Câu 30","content":"<p class=\"question-text\">Trong các cấu trúc của hệ điều hành sau đây, cấu trúc nào tương thích dễ dàng với mô hình hệ thống phân tán?</p>","choices":[{"letter":"A","html":"<span>Cấu trúc phân lớp.</span>"},{"letter":"B","html":"<span>Cấu trúc máy ảo.</span>"},{"letter":"C","html":"<span>Cấu trúc client-server.</span>"},{"letter":"D","html":"<span>Cấu trúc đơn giản.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Mô hình client-server phù hợp tự nhiên với hệ phân tán vì dịch vụ và máy khách có thể nằm trên các nút khác nhau. A, B, D không trực tiếp tương thích bằng client-server.</p>"},{"id":"c1q31","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":31,"title":"Chương 1 · Câu 31","content":"<p class=\"question-text\">Khi nào cần sử dụng đến System call (Lời gọi hệ thống)?</p>","choices":[{"letter":"A","html":"<span>Khi một người dùng yêu cầu dịch vụ nào đó từ Kernel của Hệ điều hành.</span>"},{"letter":"B","html":"<span>Khi một chương trình yêu cầu dịch vụ nào đó từ Kernel của Hệ điều hành.</span>"},{"letter":"C","html":"<span>Khi Hệ điều hành cần trợ giúp từ chương trình.</span>"},{"letter":"D","html":"<span>Khi Hệ điều hành cần trợ giúp từ người dùng.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>System call là cơ chế để chương trình yêu cầu dịch vụ từ kernel, ví dụ đọc file, tạo tiến trình hoặc dùng thiết bị. A nói người dùng trực tiếp nên chưa chính xác; C và D đảo ngược quan hệ yêu cầu.</p>"},{"id":"c1q32","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":32,"title":"Chương 1 · Câu 32","content":"<p class=\"question-text\">Lời gọi hệ thống loại “Process control” thực hiện những tác vụ nào?</p>","choices":[{"letter":"A","html":"<span>load, execute, create process, terminate process.</span>"},{"letter":"B","html":"<span>request device, release device, read from device, write to device.</span>"},{"letter":"C","html":"<span>create / delete, open / close, read, write.</span>"},{"letter":"D","html":"<span>create messages, delete messages, send messages, receive messages.</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Process control liên quan đến nạp, thực thi, tạo và kết thúc tiến trình. B là quản lý thiết bị, C là quản lý file, D là giao tiếp/thông điệp.</p>"},{"id":"c1q33","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":33,"title":"Chương 1 · Câu 33","content":"<p class=\"question-text\">Lời gọi hệ thống loại “Device management” thực hiện những tác vụ nào?</p>","choices":[{"letter":"A","html":"<span>load, execute, create process, terminate process.</span>"},{"letter":"B","html":"<span>request device, release device, read from device, write to device.</span>"},{"letter":"C","html":"<span>create / delete, open / close, read, write.</span>"},{"letter":"D","html":"<span>create messages, delete messages, send messages, receive messages.</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Device management xử lý yêu cầu thiết bị, giải phóng thiết bị và đọc/ghi thiết bị. A thuộc process control, C thuộc file management, D thuộc communication.</p>"},{"id":"c1q34","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":34,"title":"Chương 1 · Câu 34","content":"<p class=\"question-text\">Lời gọi hệ thống loại “File management” thực hiện những tác vụ nào?</p>","choices":[{"letter":"A","html":"<span>load, execute, create process, terminate process.</span>"},{"letter":"B","html":"<span>request device, release device, read from device, write to device.</span>"},{"letter":"C","html":"<span>create / delete, open / close, read, write.</span>"},{"letter":"D","html":"<span>create messages, delete messages, send messages, receive messages</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>File management gồm tạo/xóa file, mở/đóng file, đọc và ghi file. A là điều khiển tiến trình, B là quản lý thiết bị, D là giao tiếp bằng thông điệp.</p>"},{"id":"c1q35","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":35,"title":"Chương 1 · Câu 35","content":"<p class=\"question-text\">Lời gọi hệ thống loại “Communication” thực hiện những tác vụ nào?</p>","choices":[{"letter":"A","html":"<span>load, execute, create process, terminate process.</span>"},{"letter":"B","html":"<span>request device, release device, read from device, write to device.</span>"},{"letter":"C","html":"<span>create / delete, open / close, read, write.</span>"},{"letter":"D","html":"<span>create messages, delete messages, send messages, receive messages</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Communication liên quan đến tạo, xóa, gửi và nhận thông điệp giữa các tiến trình/hệ thống. A là process control, B là device management, C là file management.</p>"},{"id":"c1q36","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":36,"title":"Chương 1 · Câu 36","content":"<p class=\"question-text\">Cho biết tên gọi của kiến trúc Hệ điều hành mà tất cả các modules chức năng của nó được gom hết vào Kernel.</p>","choices":[{"letter":"A","html":"<span>Simple OS.</span>"},{"letter":"B","html":"<span>Monolithic OS.</span>"},{"letter":"C","html":"<span>Layered OS.</span>"},{"letter":"D","html":"<span>Microkernel OS</span>"}],"correct":"B","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Monolithic OS gom nhiều module chức năng vào trong kernel. Simple OS không nhấn mạnh gom module vào kernel, Layered OS chia lớp, Microkernel OS tách bớt chức năng ra ngoài kernel.</p>"},{"id":"c1q37","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":37,"title":"Chương 1 · Câu 37","content":"<p class=\"question-text\">Cho biết tên gọi của kiến trúc Hệ điều hành mà các modules chức năng của nó được phân chia thành từng lớp giao tiếp với Kernel.</p>","choices":[{"letter":"A","html":"<span>Simple OS.</span>"},{"letter":"B","html":"<span>Monolithic OS.</span>"},{"letter":"C","html":"<span>Layered OS.</span>"},{"letter":"D","html":"<span>Microkernel OS.</span>"}],"correct":"C","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Layered OS tổ chức các module thành từng lớp, mỗi lớp có vai trò và giao tiếp theo tầng. A không phải mô hình phân lớp, B gom nhiều chức năng vào kernel, D tách phần lớn dịch vụ ra ngoài kernel.</p>"},{"id":"c1q38","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":38,"title":"Chương 1 · Câu 38","content":"<p class=\"question-text\">Cho biết tên gọi của kiến trúc Hệ điều hành mà hầu hết các modules chức năng của nó được tách ra ngoài? Kernel chỉ có 2 chức năng chính: quản lý bộ nhớ và liên lạc giữa các tiến trình</p>","choices":[{"letter":"A","html":"<span>Simple OS</span>"},{"letter":"B","html":"<span>Monolithic OS</span>"},{"letter":"C","html":"<span>Layered OS</span>"},{"letter":"D","html":"<span>Microkernel OS.</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Microkernel OS giữ kernel nhỏ, chủ yếu làm quản lý bộ nhớ tối thiểu và giao tiếp liên tiến trình, còn nhiều dịch vụ chạy ngoài kernel. A, B, C không phù hợp với mô tả tách module ra ngoài.</p>"},{"id":"c1q39","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":39,"title":"Chương 1 · Câu 39","content":"<p class=\"question-text\">Kiến trúc Hệ điều hành Microkernel, nhân (kernel) của Hệ điều hành giữ vai trò gì?</p>","choices":[{"letter":"A","html":"<span>quản lý bộ nhớ và liên lạc giữa các tiến trình.</span>"},{"letter":"B","html":"<span>điều phối tiến trình và quản lý bộ nhớ</span>"},{"letter":"C","html":"<span>điều phối tiến trình và lời gọi hệ thống.</span>"},{"letter":"D","html":"<span>quản lý bộ nhớ và quản lý xuất nhập</span>"}],"correct":"A","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>Trong microkernel, kernel giữ phần tối thiểu như quản lý bộ nhớ và liên lạc giữa các tiến trình. B, C, D thêm các chức năng không đúng với mô tả tối giản ở câu hỏi.</p>"},{"id":"c1q40","chapter":1,"chapterTitle":"Chương 1: Tổng quan Hệ điều hành","number":40,"title":"Chương 1 · Câu 40","content":"<p class=\"question-text\">Kiến trúc Hệ điều hành Monolithic, module chức năng nào hỗ trợ các ứng dụng giao tiếp với nhân (kernel) của Hệ điều hành?</p>","choices":[{"letter":"A","html":"<span>Memory manager.</span>"},{"letter":"B","html":"<span>Process Scheduler.</span>"},{"letter":"C","html":"<span>Input / Output manager</span>"},{"letter":"D","html":"<span>System Calls</span>"}],"correct":"D","note":"","explanation":"<h3>Giải thích ngắn gọn</h3>\n<p>System Calls là giao diện để ứng dụng yêu cầu dịch vụ từ kernel. Memory manager, Process Scheduler và Input/Output manager là các module chức năng bên trong hệ điều hành chứ không phải giao diện gọi dịch vụ chung cho ứng dụng.</p>"},{"id":"c2q1","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":1,"title":"Chương 2 · Câu 1","content":"<p class=\"question-text\">Tiến trình (process) là gì:</p>","choices":[{"letter":"A","html":"<span>là một đoạn code chương trình</span>"},{"letter":"B","html":"<span>là nơi chứa các dữ liệu chương trình</span>"},{"letter":"C","html":"<span>là nơi quản lý toàn bộ các bộ nhớ cấp phát trong quá trình hoạt động</span>"},{"letter":"D","html":"<span>là một chương trình đang chạy trên máy tính</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì tiến trình là một chương trình đang được thực thi. A chỉ là mã chương trình, B chỉ nói nơi chứa dữ liệu, C nói về quản lý bộ nhớ nên không định nghĩa đúng tiến trình.</p>"},{"id":"c2q2","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":2,"title":"Chương 2 · Câu 2","content":"<p class=\"question-text\">Người dùng sử dụng ngôn ngữ lập trình để viết (code) một phần mềm. Sau đó biên dịch thành các tập tin lưu trữ thành trong đĩa. Các tập tin đó được gọi là gì?</p>","choices":[{"letter":"A","html":"<span>Chương trình (program)</span>"},{"letter":"B","html":"<span>Tiến trình (process)</span>"},{"letter":"C","html":"<span>Tiểu trình (sub-process)</span>"},{"letter":"D","html":"<span>Luồng (thread)</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì tập tin sau khi biên dịch và lưu trên đĩa là chương trình. B chỉ xuất hiện khi chương trình được nạp và chạy, C là tiến trình con, D là luồng thực thi trong tiến trình.</p>"},{"id":"c2q3","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":3,"title":"Chương 2 · Câu 3","content":"<p class=\"question-text\">Để một chương trình (program) trở thành một tiến trình (process), cần phải làm gì?</p>","choices":[{"letter":"A","html":"<span>Biên dịch lại chương trình.</span>"},{"letter":"B","html":"<span>Nạp chương trình vào bộ nhớ.</span>"},{"letter":"C","html":"<span>Gán quyền thực thi cho chương trình.</span>"},{"letter":"D","html":"<span>Nạp chương trình vào CPU.</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì chương trình phải được nạp vào bộ nhớ để hệ điều hành tạo và quản lý như một tiến trình. A chỉ tạo/chỉnh chương trình, C chỉ liên quan quyền chạy, D không chính xác vì CPU xử lý tiến trình chứ không “nạp chương trình vào CPU”.</p>"},{"id":"c2q4","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":4,"title":"Chương 2 · Câu 4","content":"<p class=\"question-text\">Thuật ngữ \"CPU-bound process\" có nghĩa là gì?</p>","choices":[{"letter":"A","html":"<span>là tiến trình được xử lý bởi CPU.</span>"},{"letter":"B","html":"<span>là tiến trình được xử lý bởi thiết bị I/O.</span>"},{"letter":"C","html":"<span>là tiến trình được xử lý bởi Hệ điều hành.</span>"},{"letter":"D","html":"<span>là tiến trình tạo ra bởi CPU.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì CPU-bound là tiến trình dành phần lớn thời gian để tính toán/xử lý trên CPU. B là I/O-bound, C quá chung, D sai vì CPU không tạo ra tiến trình.</p>"},{"id":"c2q5","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":5,"title":"Chương 2 · Câu 5","content":"<p class=\"question-text\">Thuật ngữ \"I/O-bound process\" có nghĩa là gì?</p>","choices":[{"letter":"A","html":"<span>là tiến trình được xử lý bởi CPU.</span>"},{"letter":"B","html":"<span>là tiến trình được xử lý bởi thiết bị I/O.</span>"},{"letter":"C","html":"<span>là tiến trình được xử lý bởi Hệ điều hành.</span>"},{"letter":"D","html":"<span>là tiến trình tạo ra bởi thiết bị I/O.</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì I/O-bound là tiến trình phụ thuộc nhiều vào thao tác nhập/xuất. A mô tả CPU-bound, C quá chung, D sai vì thiết bị I/O không tạo ra tiến trình.</p>"},{"id":"c2q6","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":6,"title":"Chương 2 · Câu 6","content":"<p class=\"question-text\">Phát biểu nào sau đây là KHÔNG ĐÚNG với khái niệm tiến trình (process)?</p>","choices":[{"letter":"A","html":"<span>Tiến trình tự quyết định thời điểm dừng chạy để CPU phục vụ tiến trình khác.</span>"},{"letter":"B","html":"<span>Tiến trình là một chương trình đang tồn tại trong bộ nhớ.</span>"},{"letter":"C","html":"<span>Tiến trình là một chương trình đang xử lí.</span>"},{"letter":"D","html":"<span>Tiến trình sở hữu một không gian bộ nhớ, con trỏ lệnh, tập thanh ghi và stack riêng.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng là phát biểu không đúng, vì việc dừng/chuyển CPU do hệ điều hành và bộ lập lịch quyết định. B, C, D đều mô tả các đặc điểm cơ bản của tiến trình.</p>"},{"id":"c2q7","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":7,"title":"Chương 2 · Câu 7","content":"<p class=\"question-text\">Một tiến trình (process) bao gồm các thành phần:</p>","choices":[{"letter":"A","html":"<span>Current activity</span>"},{"letter":"B","html":"<span>Data section &amp; Heap</span>"},{"letter":"C","html":"<span>Text section &amp; Stack</span>"},{"letter":"D","html":"<span>Current activity, Data section &amp; Heap, Text section &amp; Stack Point</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì một tiến trình gồm hoạt động hiện tại cùng các vùng text, data, heap và stack. A, B, C chỉ nêu một phần nên chưa đầy đủ.</p>"},{"id":"c2q8","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":8,"title":"Chương 2 · Câu 8","content":"<p class=\"question-text\">Hệ điều hành sẽ KHÔNG cấp phát loại tài nguyên nào cho tiến trình?</p>","choices":[{"letter":"A","html":"<span>Mỗi tiến trình sẽ được cấp một không gian bộ nhớ riêng.</span>"},{"letter":"B","html":"<span>Mỗi tiến trình sẽ được cấp một phân vùng đĩa cứng (partition) riêng.</span>"},{"letter":"C","html":"<span>Mỗi tiến trình sẽ được cấp một tập các thanh ghi (Register) và ngăn xếp (stack) riêng</span>"},{"letter":"D","html":"<span>Mỗi tiến trình sẽ được cấp một con trỏ lệnh (Program Counter).</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì hệ điều hành không cấp riêng một phân vùng đĩa cứng cho mỗi tiến trình. A, C, D là các tài nguyên/trạng thái thường gắn với tiến trình khi chạy.</p>"},{"id":"c2q9","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":9,"title":"Chương 2 · Câu 9","content":"<p class=\"question-text\">Tiến trình ở trạng thái Running có nghĩa là :</p>","choices":[{"letter":"A","html":"<span>Tiến trình đang hoạt động trong bộ nhớ.</span>"},{"letter":"B","html":"<span>Tiến trình nhận được CPU</span>"},{"letter":"C","html":"<span>Tiến trình đang bắt đầu các xử lí</span>"},{"letter":"D","html":"<span>Nhận được CPU và bắt đầu các xử lí của mình</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì Running nghĩa là tiến trình đã được CPU cấp phát và đang thực thi. A chỉ nói tồn tại trong bộ nhớ, B chưa đủ ý thực thi, C chưa nói rõ tiến trình đã nhận CPU.</p>"},{"id":"c2q10","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":10,"title":"Chương 2 · Câu 10","content":"<p class=\"question-text\">Tiến trình ở trạng thái Ready có nghĩa là :</p>","choices":[{"letter":"A","html":"<span>Tiến trình đang tồn tại trong bộ nhớ.</span>"},{"letter":"B","html":"<span>Tiến trình nhận được CPU</span>"},{"letter":"C","html":"<span>Tiến trình đang chờ CPU xử lý.</span>"},{"letter":"D","html":"<span>Tiến trình đang tồn tại trong bộ nhớ và đang chờ CPU xử lý.</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì Ready là tiến trình đã ở trong bộ nhớ, sẵn sàng chạy nhưng đang chờ CPU. A thiếu ý chờ CPU, B là Running, C thiếu điều kiện tồn tại trong bộ nhớ.</p>"},{"id":"c2q11","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":11,"title":"Chương 2 · Câu 11","content":"<p class=\"question-text\">Giải thích nào sau đây đúng với trạng thái Suspend của tiến trình:</p>","choices":[{"letter":"A","html":"<span>Tiến trình đang tồn tại trong bộ nhớ phụ.</span>"},{"letter":"B","html":"<span>Tiến trình nhận được CPU</span>"},{"letter":"C","html":"<span>Tiến trình đang chờ CPU xử lý.</span>"},{"letter":"D","html":"<span>Tiến trình đang tồn tại trong bộ nhớ.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì Suspended là trạng thái tiến trình bị tạm ngưng và thường được chuyển ra bộ nhớ phụ. B là Running, C là Ready/Waiting CPU, D là tiến trình còn trong bộ nhớ chính.</p>"},{"id":"c2q12","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":12,"title":"Chương 2 · Câu 12","content":"<p class=\"question-text\">Nguyên nhân dẫn đến trạng thái BLOCKED của một process?</p>","choices":[{"letter":"A","html":"<span>process đang chờ nhập xuất.</span>"},{"letter":"B","html":"<span>process đang chờ một sự kiện nào đó chưa xảy ra.</span>"},{"letter":"C","html":"<span>process đang chờ nhập xuất hoặc là đang chờ một sự kiện chưa xảy ra.</span>"},{"letter":"D","html":"<span>không có nguyên nhân nào đúng.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì Blocked xảy ra khi tiến trình chờ I/O hoặc chờ một sự kiện. A và B chỉ nêu một trường hợp, D sai vì có nguyên nhân đúng.</p>"},{"id":"c2q13","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":13,"title":"Chương 2 · Câu 13","content":"<p class=\"question-text\">Những trạng thái tiến trình nào liệt kê dưới đây thuộc về loại tiến trình 2 trạng thái?</p>","choices":[{"letter":"A","html":"<span>Running &amp; Blocked</span>"},{"letter":"B","html":"<span>Running &amp; Not running.</span>"},{"letter":"C","html":"<span>New &amp; Running</span>"},{"letter":"D","html":"<span>New &amp; Terminated.</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì mô hình 2 trạng thái chia tiến trình thành Running và Not running. A, C, D đưa vào các trạng thái không thuộc cặp cơ bản của mô hình này.</p>"},{"id":"c2q14","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":14,"title":"Chương 2 · Câu 14","content":"<p class=\"question-text\">Những trạng thái tiến trình nào liệt kê dưới đây thuộc về loại tiến trình 3 trạng thái?</p>","choices":[{"letter":"A","html":"<span>Ready &amp; Running &amp; Blocked</span>"},{"letter":"B","html":"<span>Ready &amp; Running &amp; Suspend</span>"},{"letter":"C","html":"<span>New &amp; Running &amp; Waiting</span>"},{"letter":"D","html":"<span>New &amp; Running &amp; Blocked</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì mô hình 3 trạng thái gồm Ready, Running và Blocked. B có Suspend, C và D có New nên không phải bộ 3 trạng thái cơ bản này.</p>"},{"id":"c2q15","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":15,"title":"Chương 2 · Câu 15","content":"<p class=\"question-text\">Những trạng thái tiến trình nào liệt kê dưới đây thuộc về loại tiến trình 4 trạng thái?</p>","choices":[{"letter":"A","html":"<span>Ready &amp; Running &amp; Blocked &amp; Suspend</span>"},{"letter":"B","html":"<span>New &amp; Ready &amp; Running &amp; Suspend</span>"},{"letter":"C","html":"<span>New &amp; Running &amp; Waiting &amp; Blocked</span>"},{"letter":"D","html":"<span>Running &amp; Blocked &amp; Suspend &amp; Closed</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì bộ này mở rộng Ready, Running, Blocked với Suspend. B thiếu Blocked, C có New và Waiting không đúng bộ lựa chọn, D có Closed không phải trạng thái chuẩn trong bộ này.</p>"},{"id":"c2q16","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":16,"title":"Chương 2 · Câu 16","content":"<p class=\"question-text\">Những trạng thái tiến trình nào sau đây không thuộc về loại tiến trình 5 trạng thái?</p>","choices":[{"letter":"A","html":"<span>Blocked, Blocked-Suspend.</span>"},{"letter":"B","html":"<span>Ready, Ready-Suspend.</span>"},{"letter":"C","html":"<span>Running-Suspend.</span>"},{"letter":"D","html":"<span>Running.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì Running-Suspend không thuộc mô hình 5 trạng thái và cũng không phải trạng thái thông dụng. A và B có một trạng thái hợp lệ kèm trạng thái suspend, D là trạng thái Running hợp lệ.</p>"},{"id":"c2q17","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":17,"title":"Chương 2 · Câu 17","content":"<p class=\"question-text\">Đối với loại tiến trình 3 trạng thái. Khi tiến trình P yêu cầu tài nguyên R, nhưng tài nguyên R chưa sẵn sàng đáp ứng. Do vậy, tiến trình P sẽ chuyển trạng thái:</p>","choices":[{"letter":"A","html":"<span>Running -&gt; Ready</span>"},{"letter":"B","html":"<span>Ready -&gt; Running.</span>"},{"letter":"C","html":"<span>Running -&gt; Blocked.</span>"},{"letter":"D","html":"<span>Blocked -&gt; Ready.</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì khi đang chạy mà phải chờ tài nguyên/sự kiện, tiến trình chuyển từ Running sang Blocked. A là bị thu hồi CPU, B là được cấp CPU, D là khi sự kiện chờ đã xảy ra.</p>"},{"id":"c2q18","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":18,"title":"Chương 2 · Câu 18","content":"<p class=\"question-text\">Đối với loại tiến trình 4 trạng thái. Khi tiến trình P đang ở trạng thái Blocked khá lâu, để giải phóng bộ nhớ, Hệ điều hành sẽ chuyển tiến trình P sang trạng thái nào?</p>","choices":[{"letter":"A","html":"<span>Blocked -&gt; Ready</span>"},{"letter":"B","html":"<span>Blocked -&gt; suspend</span>"},{"letter":"C","html":"<span>Blocked -&gt; Running.</span>"},{"letter":"D","html":"<span>Blocked -&gt; Terminated</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì tiến trình Blocked lâu có thể bị tạm ngưng/đưa ra khỏi bộ nhớ để giải phóng bộ nhớ. A chỉ xảy ra khi điều kiện chờ hoàn tất, C không thể từ Blocked chạy ngay, D là kết thúc tiến trình.</p>"},{"id":"c2q19","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":19,"title":"Chương 2 · Câu 19","content":"<p class=\"question-text\">Đối với loại tiến trình 5 trạng thái. Khi tiến trình P đang ở trạng thái Ready khá lâu, để giải phóng bộ nhớ, Hệ điều hành sẽ chuyển tiến trình P sang trạng thái nào?</p>","choices":[{"letter":"A","html":"<span>Ready -&gt; Ready-suspend.</span>"},{"letter":"B","html":"<span>Ready -&gt; Blocked-suspend.</span>"},{"letter":"C","html":"<span>Ready -&gt; Running-suspend.</span>"},{"letter":"D","html":"<span>Ready -&gt; Terminated.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì tiến trình đang Ready nếu bị đưa ra bộ nhớ phụ sẽ thành Ready-suspend. B dành cho tiến trình bị chặn, C không phải trạng thái hợp lệ, D là kết thúc tiến trình.</p>"},{"id":"c2q20","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":20,"title":"Chương 2 · Câu 20","content":"<p class=\"question-text\">Khi CPU đang xử lý tiến trình P thì xảy ra Interrupt. Hệ điều hành sẽ chuyển trạng thái của tiến trình P từ:</p>","choices":[{"letter":"A","html":"<span>running -&gt; waiting</span>"},{"letter":"B","html":"<span>running -&gt; ready</span>"},{"letter":"C","html":"<span>waiting -&gt; ready</span>"},{"letter":"D","html":"<span>Kết thúc -&gt; Terminates</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì interrupt có thể làm tiến trình đang chạy bị thu hồi CPU và quay về hàng đợi Ready. A là khi tiến trình phải chờ I/O/sự kiện, C là sự kiện chờ hoàn tất, D là kết thúc tiến trình.</p>"},{"id":"c2q21","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":21,"title":"Chương 2 · Câu 21","content":"<p class=\"question-text\">Mục đích của việc cho nhiều tiến trình hoạt động đồng thời trên một Hệ điều hành:</p>","choices":[{"letter":"A","html":"<span>Tăng mức độ đa chương</span>"},{"letter":"B","html":"<span>Tăng mức độ đa nhiệm</span>"},{"letter":"C","html":"<span>Tăng tốc độ xử lý</span>"},{"letter":"D","html":"<span>Tăng tốc độ xử lý, đa chương trình và đa nhiệm.</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì cho nhiều tiến trình hoạt động đồng thời nhằm nâng hiệu quả xử lý tổng thể và hỗ trợ đa chương trình, đa nhiệm. A, B, C chỉ nêu từng phần riêng lẻ nên chưa đầy đủ.</p>"},{"id":"c2q22","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":22,"title":"Chương 2 · Câu 22","content":"<p class=\"question-text\">Để có thể chạy được nhiều tiến trình cùng lúc, giải pháp cơ bản của Hệ điều hành là gì?</p>","choices":[{"letter":"A","html":"<span>Cho mỗi CPU thực thi một tiến trình.</span>"},{"letter":"B","html":"<span>Điều phối CPU luân phiên thực thi từng tiến trình</span>"},{"letter":"C","html":"<span>Gộp nhiều tiến trình thành một cho CPU thực thi.</span>"},{"letter":"D","html":"<span>Hệ điều hành không cho phép chạy nhiều tiến trình cùng lúc</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì hệ điều hành dùng lập lịch và chia thời gian CPU để luân phiên chạy các tiến trình. A chỉ đúng khi có nhiều CPU và không phải giải pháp cơ bản chung, C sai vì không gộp tiến trình, D trái với đa nhiệm.</p>"},{"id":"c2q23","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":23,"title":"Chương 2 · Câu 23","content":"<p class=\"question-text\">Người dùng Windows có thể vừa duyệt web, nghe nhạc, chat, chơi game... đồng thời. Hệ điều hành Windows thực hiện được là do:</p>","choices":[{"letter":"A","html":"<span>Máy tính có nhiều CPU. Mỗi CPU chạy 1 chương trình</span>"},{"letter":"B","html":"<span>Máy tính có nhiều RAM.</span>"},{"letter":"C","html":"<span>Máy tính có HDD lớn.</span>"},{"letter":"D","html":"<span>Tốc độ chuyển đổi xử lý nhiều tiến trình của CPU quá nhanh.</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì hệ điều hành chuyển đổi CPU giữa các tiến trình rất nhanh nên người dùng thấy như chạy đồng thời. A không bắt buộc, B và C chỉ là tài nguyên lưu trữ/bộ nhớ, không giải thích cơ chế đa nhiệm.</p>"},{"id":"c2q24","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":24,"title":"Chương 2 · Câu 24","content":"<p class=\"question-text\">Trong quá trình thực thi, tiến trình A khởi tạo thêm tiến trình B hoạt động song song với A. Hình thức đa tiến trình này có tên gọi là:</p>","choices":[{"letter":"A","html":"<span>Tiến trình song song độc lập.</span>"},{"letter":"B","html":"<span>Tiến trình song song có quan hệ thông tin.</span>"},{"letter":"C","html":"<span>Tiến trình song song phân cấp</span>"},{"letter":"D","html":"<span>Tiến trình song song đồng mức</span>"}],"correct":"C","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>C đúng vì A tạo ra B nên có quan hệ cha-con/phân cấp. A là không liên quan, B là có trao đổi thông tin, D là các tiến trình ngang hàng dùng chung tài nguyên.</p>"},{"id":"c2q25","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":25,"title":"Chương 2 · Câu 25","content":"<p class=\"question-text\">Tiến trình A cùng hoạt động trong Hệ điều hành cùng với tiến trình B. Cả 2 không có trao đổi thông tin gì cho nhau. Hình thức đa tiến trình này có tên gọi là:</p>","choices":[{"letter":"A","html":"<span>Tiến trình song song độc lập</span>"},{"letter":"B","html":"<span>Tiến trình song song có quan hệ thông tin.</span>"},{"letter":"C","html":"<span>Tiến trình song song phân cấp</span>"},{"letter":"D","html":"<span>Tiến trình song song đồng mức.</span>"}],"correct":"A","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>A đúng vì hai tiến trình không trao đổi thông tin là song song độc lập. B sai vì có quan hệ thông tin, C sai vì không nói quan hệ cha-con, D sai vì không nói dùng chung tài nguyên luân phiên.</p>"},{"id":"c2q26","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":26,"title":"Chương 2 · Câu 26","content":"<p class=\"question-text\">Tiến trình A cùng hoạt động trong Hệ điều hành cùng với tiến trình B. Hai tiến trình này cần trao đổi dữ liệu cho nhau. Hình thức đa tiến trình này có tên gọi là:</p>","choices":[{"letter":"A","html":"<span>Tiến trình song song độc lập.</span>"},{"letter":"B","html":"<span>Tiến trình song song có quan hệ thông tin.</span>"},{"letter":"C","html":"<span>Tiến trình song song phân cấp.</span>"},{"letter":"D","html":"<span>Tiến trình song song đồng mức.</span>"}],"correct":"B","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>B đúng vì hai tiến trình cần trao đổi dữ liệu nên có quan hệ thông tin. A là không trao đổi, C là quan hệ cha-con, D là dùng chung tài nguyên theo kiểu ngang hàng/luân phiên.</p>"},{"id":"c2q27","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":27,"title":"Chương 2 · Câu 27","content":"<p class=\"question-text\">Tiến trình A cùng hoạt động trong Hệ điều hành cùng với tiến trình B. Cả 2 có sử dụng chung tài nguyên theo nguyên tắc luân phiên. Hình thức đa tiến trình này có tên gọi là:</p>","choices":[{"letter":"A","html":"<span>Tiến trình song song độc lập.</span>"},{"letter":"B","html":"<span>Tiến trình song song có quan hệ thông tin</span>"},{"letter":"C","html":"<span>Tiến trình song song phân cấp</span>"},{"letter":"D","html":"<span>Tiến trình song song đồng mức</span>"}],"correct":"D","note":"","explanation":"<div class=\"ex-title\">Giải thích ngắn gọn</div>\n<p>D đúng vì các tiến trình ngang hàng dùng chung tài nguyên theo nguyên tắc luân phiên là song song đồng mức. A không dùng chung/trao đổi, B tập trung vào trao đổi thông tin, C là quan hệ phân cấp.</p>"},{"id":"c2q28","chapter":2,"chapterTitle":"Chương 2: Quản lý tiến trình","number":28,"title":"Chương 2 · Câu 28","content":"<p class=\"question-text\">Có 3 tiến trình P1, P2, P3 cùng hoạt động song song trong hệ thống máy tính. Biểu đồ hoạt động của chúng mô tả theo hình dưới.</p>\n<div class=\"diagram-wrap\">\n<img alt=\"Biểu đồ hoạt động P1 P2 P3 theo thời gian - câu 28, cắt từ PDF gốc\" class=\"diagram-img\" src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA1wAAADkCAIAAAAD9rIWAABtXElEQVR42u296W+cV5YefqvevXZWkSzumzZKolbbsrx0t22kuwNMejDdSBAgySQfsiCf8iV/QD7OPxAgCCZAI4MkQCcYBJlJetIzDtptd7tlyJZkW6JFbaQoivtSrO3dq34fnuH5Xb9FybIsisXieT4IV6WqUp33fe+9557nnOfEms2mEKLZbMZiMSHEXoz39MvbYcwGsoFsIBvIBr4QA/lWsoFs4D6OY41GQzAYDAaDwWAwDjdiHClkA9lANpANZAM5Usi3kg1kA+PsFzMYDAaDwWAwmD5mMBgMBoPBYDB9zAaygWwgG8gGMn3Mt5INZAOZPmYwGAwGg8FgCCHYKWQwGAwGg8Fgc
